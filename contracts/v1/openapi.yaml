openapi: 3.1.0
info:
  title: Bacuri VMS API
  version: 1.6.0
servers:
  - url: /api/v1
security:
  - browserSession: []
paths:
  /sites/{siteId}/points/{pointId}/holds:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - {name: pointId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: listArchiveHolds
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ArchiveHold'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CameraFailure'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createArchiveHold
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HoldDraft'}
      responses:
        '201':
          description: Successful operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HoldId'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CameraFailure'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /sites/{siteId}/investigations:
    parameters:
      - {$ref: '#/components/parameters/Site'}
    get:
      operationId: listInvestigations
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Investigation'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CameraFailure'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /sites/{siteId}/investigations/{caseId}:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - {name: caseId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getInvestigation
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Investigation'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CameraFailure'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: saveInvestigation
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvestigationDraft'}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedInvestigation'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CameraFailure'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /sites/{siteId}/archive-search:
    parameters:
      - {$ref: '#/components/parameters/Site'}
    post:
      operationId: searchArchiveFrames
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveSearch'}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/SearchTrack'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CameraFailure'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /sites/{siteId}/points/{pointId}/video-rule:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - {name: pointId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getVideoRule
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleVersion'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CameraFailure'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: setVideoRule
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleChange'}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleVersion'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CameraFailure'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /sites/{siteId}/points/{pointId}/video-rule/simulation:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - {name: pointId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    post:
      operationId: simulateVideoRule
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuleTrial'}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrialResult'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CameraFailure'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /sites/{siteId}/investigations/{caseId}/exports:
    parameters:
      - {$ref: '#/components/parameters/Site'}
      - {name: caseId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    post:
      operationId: exportInvestigation
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaseExport'}
      responses:
        '200':
          description: Signed investigation archive.
          content:
            application/x-tar:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CameraFailure'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /sites/{siteId}/investigation-assignees:
    parameters:
      - {$ref: '#/components/parameters/Site'}
    post:
      operationId: listCaseRecipients
      parameters:
        - {$ref: '#/components/parameters/Csrf'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaseRecipients'}
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CaseRecipient'}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/CameraFailure'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /sites/{siteId}/recording-policies:
    parameters:
    - $ref: '#/components/parameters/Site'
    get:
      operationId: listRecordingPolicies
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPolicyList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Configuration or current recording state changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sites/{siteId}/recording-policies/{policyId}:
    parameters:
    - $ref: '#/components/parameters/Site'
    - name: policyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    get:
      operationId: getRecordingPolicy
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPolicy'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Configuration or current recording state changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: saveRecordingPolicy
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - id
                - revision
                properties:
                  id:
                    $ref: '#/components/schemas/Id'
                  revision:
                    type: string
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Configuration or current recording state changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingPolicyDraft'
    delete:
      operationId: deleteRecordingPolicy
      responses:
        '204':
          description: Operation completed.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Configuration or current recording state changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
  /sites/{siteId}/storage/volumes:
    parameters:
    - $ref: '#/components/parameters/Site'
    get:
      operationId: getRecordingStorage
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingStorage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Configuration or current recording state changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: setRecordingStorage
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingStorage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Configuration or current recording state changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - days
              - reserve_percent
              - revision
              properties:
                revision: { type: string, pattern: '^[0-9]+$' }
                days:
                  type: integer
                  minimum: 1
                  maximum: 36500
                reserve_percent:
                  type: integer
                  minimum: 1
                  maximum: 90
  /sites/{siteId}/points/{pointId}/recording:
    parameters:
    - $ref: '#/components/parameters/Site'
    - $ref: '#/components/parameters/Point'
    get:
      operationId: getManualRecording
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingManualState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Configuration or current recording state changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: setManualRecording
      responses:
        '200':
          description: Operation completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingManualState'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Configuration or current recording state changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - active
              properties:
                active:
                  type: boolean
                seconds:
                  type: integer
                  minimum: 1
                  maximum: 3600
  /sites/{siteId}/users:
    parameters:
    - $ref: '#/components/parameters/Site'
    get:
      operationId: listSiteUsers
      responses:
        '200':
          description: Current policy revision and result.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  revision:
                    type: string
                    pattern: ^[0-9]+$
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessUser'
                required:
                - revision
                - data
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createSiteUser
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Quoted access policy revision from the last read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '200':
          description: Current policy revision and result.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessChange'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Policy conflict or missing precondition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: Policy conflict or missing precondition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: Policy conflict or missing precondition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sites/{siteId}/resource-groups:
    parameters:
    - $ref: '#/components/parameters/Site'
    get:
      operationId: listResourceGroups
      responses:
        '200':
          description: Current policy revision and result.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  revision:
                    type: string
                    pattern: ^[0-9]+$
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessGroup'
                required:
                - revision
                - data
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createResourceGroup
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Quoted access policy revision from the last read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupDefinition'
      responses:
        '200':
          description: Current policy revision and result.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessChange'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Policy conflict or missing precondition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: Policy conflict or missing precondition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: Policy conflict or missing precondition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sites/{siteId}/grants:
    parameters:
    - $ref: '#/components/parameters/Site'
    get:
      operationId: listGrants
      responses:
        '200':
          description: Current policy revision and result.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  revision:
                    type: string
                    pattern: ^[0-9]+$
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessGrant'
                required:
                - revision
                - data
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /sites/{siteId}/privacy-policies:
    parameters:
    - $ref: '#/components/parameters/Site'
    get:
      operationId: listPrivacyPolicies
      responses:
        '200':
          description: Current policy revision and result.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  revision:
                    type: string
                    pattern: ^[0-9]+$
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrivacyEntry'
                required:
                - revision
                - data
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /sites/{siteId}/users/{userId}:
    parameters:
    - $ref: '#/components/parameters/Site'
    - in: path
      name: userId
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    patch:
      operationId: updateSiteUser
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Quoted access policy revision from the last read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPolicy'
      responses:
        '200':
          description: Current policy revision and result.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessChange'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Policy conflict or missing precondition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: Policy conflict or missing precondition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: Policy conflict or missing precondition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sites/{siteId}/resource-groups/{groupId}:
    parameters:
    - $ref: '#/components/parameters/Site'
    - in: path
      name: groupId
