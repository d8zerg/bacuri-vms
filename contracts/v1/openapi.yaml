  /session/webauthn:
    post:
      operationId: verifyAdminFactor
      security: []
      description: Complete a password-authenticated challenge on the issuing origin. Enrollment requires a subsequent assertion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactorAnswer' }
      responses:
        '201':
          description: Both factors verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSession' }
        '204': { description: Credential registered. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /session:
    post:
      operationId: createSession
      security: []
      description: Authenticate locally. Require the exact browser origin and application/json.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '202':
          description: Password accepted. A WebAuthn ceremony is required before issuing a session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactorChallenge' }
        '201':
          description: Session created. Rotate the browser credential on every successful login.
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
              description: '__Host-bacuri_session with Secure, HttpOnly, SameSite=Strict and Path=/.'
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSession' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      operationId: getSession
      description: Read identity and access without extending the idle timeout.
      responses:
        '200':
          description: Current session and its CSRF token.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Session and its media grants revoked. Repeated revocation is harmless.
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
              description: Clear the browser session cookie.
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
