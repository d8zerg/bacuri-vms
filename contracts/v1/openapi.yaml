openapi: 3.1.0
info:
  title: Bacuri VMS API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - browserSession: []
paths:
  /session:
    post:
      operationId: createSession
      security: []
      description: Authenticate locally. Require the exact browser origin and application/json.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '201':
          description: Session created. Rotate the browser credential on every successful login.
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
              description: '__Host-bacuri_session with Secure, HttpOnly, SameSite=Strict and Path=/.'
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSession' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      operationId: getSession
      responses:
        '200':
          description: Current session and its CSRF token.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Session and its media grants revoked. Repeated revocation is harmless.
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
              description: Clear the browser session cookie.
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sites/{siteId}/points:
    parameters:
      - $ref: '#/components/parameters/Site'
    get:
      operationId: listPoints
      description: List observation points visible to the current session.
      responses:
        '200':
          description: Visible observation points and their current status.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Point' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sites/{siteId}/cameras:
    parameters:
      - $ref: '#/components/parameters/Site'
    get:
      operationId: listCameras
      description: List camera configurations, including desired and applied revisions.
      responses:
        '200':
          description: Site camera configurations visible to its administrator.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Camera' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: registerCamera
      description: Register a camera at the selected point, or create its point when point_id is omitted.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CameraConfiguration'
      responses:
        '201':
          description: Configuration persisted. A replay returns the original result.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            ETag: { $ref: '#/components/headers/Revision' }
            Location:
              required: true
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Camera' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency key reused with a different request.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sites/{siteId}/cameras/{cameraId}:
    parameters:
      - $ref: '#/components/parameters/Site'
      - name: cameraId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      operationId: getCamera
      responses:
        '200':
          description: Current site camera configuration.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            ETag: { $ref: '#/components/headers/Revision' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Camera' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: updateCamera
      description: Update the camera. The observation point stays the same.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: If-Match
          in: header
          required: true
          schema: { $ref: '#/components/schemas/StrongRevision' }
      requestBody:
        $ref: '#/components/requestBodies/CameraConfiguration'
      responses:
        '200':
          description: Current configuration after the update.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            ETag: { $ref: '#/components/headers/Revision' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Camera' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412':
          description: Revision changed. Fetch the camera again before retrying.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            ETag: { $ref: '#/components/headers/Revision' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/RevisionConflict' }
        '428':
          description: Missing If-Match header.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sites/{siteId}/points/{pointId}/archive:
    parameters:
      - $ref: '#/components/parameters/Site'
      - $ref: '#/components/parameters/Point'
    get:
      operationId: searchArchive
      description: Search a half-open UTC interval of at most one hour. Return at most 1000 entries, ordered by start time.
      parameters:
        - name: start
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UtcTime' }
        - name: end
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UtcTime' }
        - name: cursor
          in: query
          schema: { $ref: '#/components/schemas/Cursor' }
      responses:
        '200':
          description: Known archive intervals. The continuation cursor is bound to the search and current access scope.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchivePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sites/{siteId}/points/{pointId}/media-sessions:
    parameters:
      - $ref: '#/components/parameters/Site'
      - $ref: '#/components/parameters/Point'
    post:
      operationId: createMediaSession
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaRequest' }
      responses:
        '201':
          description: Media session scoped to this browser session, point, mode and requested archive interval.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaSession' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Replay mismatch or unavailable media in the requested interval.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /media-sessions/{mediaSessionId}:
    parameters:
      - $ref: '#/components/parameters/MediaSession'
    delete:
      operationId: revokeMediaSession
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: The caller's session is revoked. Absent, closed and foreign sessions return the same response.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /media-sessions/{mediaSessionId}/offer:
    parameters:
      - $ref: '#/components/parameters/MediaSession'
    post:
      operationId: negotiateLiveMedia
      description: Negotiate a WebRTC live session using a complete SDP offer with gathered ICE candidates.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/sdp:
            schema: { type: string, maxLength: 65536 }
      responses:
        '200':
          description: SDP answer with gathered ICE candidates.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/sdp:
              schema: { type: string, maxLength: 65536 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/MediaSessionClosed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /media-sessions/{mediaSessionId}/manifest:
    parameters:
      - $ref: '#/components/parameters/MediaSession'
    get:
      operationId: getPlaybackManifest
      responses:
        '200':
          description: Authorized MSE playback plan. Parts are relative to the current media session.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackManifest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/MediaSessionClosed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /media-sessions/{mediaSessionId}/parts/{partId}:
    parameters:
      - $ref: '#/components/parameters/MediaSession'
      - name: partId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      operationId: readPlaybackPart
      responses:
        '200':
          description: Authorized initialization or media segment.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/MediaSessionClosed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sites/{siteId}/alerts:
    parameters:
      - $ref: '#/components/parameters/Site'
    get:
      operationId: getAlertSnapshot
      responses:
        '200':
          description: Consistent snapshot of the latest 100 visible alerts and its WebSocket resume cursor.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSnapshot' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-bacuri_session
  parameters:
    Site:
      name: siteId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Point:
      name: pointId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    MediaSession:
      name: mediaSessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { $ref: '#/components/schemas/CsrfToken' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { $ref: '#/components/schemas/Id' }
  headers:
    Revision:
      required: true
      schema: { $ref: '#/components/schemas/StrongRevision' }
    NoStore:
      required: true
      schema: { type: string, const: no-store }
  requestBodies:
    CameraConfiguration:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CameraConfiguration' }
  responses:
    InvalidRequest:
      description: Malformed input, invalid range, configuration or query cursor.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Invalid credentials, missing or expired session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The operation is forbidden by role, origin or CSRF policy.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource absent or outside the applicable scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MediaSessionClosed:
      description: Media session expired or revoked for its owning browser session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: A session or request limit has been reached.
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: A required authorization, catalog or delivery dependency is unavailable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Id:
      type: string
      format: uuid
      pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'
    UtcTime:
      type: string
      format: date-time
      pattern: 'Z$'
    Cursor:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '^[A-Za-z0-9_-]+$'
    CsrfToken:
      type: string
      minLength: 43
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
    Revision:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Positive signed 64-bit integer encoded as decimal text.
    StrongRevision:
      type: string
      pattern: '^"[A-Za-z0-9_-]{1,128}"$'
      description: Strong opaque entity tag for the complete camera representation.
    UtcInterval:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: { $ref: '#/components/schemas/UtcTime' }
        end: { $ref: '#/components/schemas/UtcTime' }
      description: Half-open interval with start strictly earlier than end.
    Login:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    BrowserSession:
      type: object
      required: [user_id, site_roles, expires_at, csrf_token]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        site_roles:
          type: array
          items:
            type: object
            required: [site_id, role]
            properties:
              site_id: { $ref: '#/components/schemas/Id' }
              role: { type: string, enum: [administrator, operator] }
        expires_at: { $ref: '#/components/schemas/UtcTime' }
        csrf_token: { $ref: '#/components/schemas/CsrfToken' }
    CameraConfiguration:
      type: object
      additionalProperties: false
      required: [name, main_url, secondary_url]
      properties:
        point_id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 256 }
        main_url: { $ref: '#/components/schemas/CameraStreamUrl' }
        secondary_url: { $ref: '#/components/schemas/CameraStreamUrl' }
        credentials:
          description: Omit to retain existing credentials or use null to remove them.
          writeOnly: true
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 128 }
                password: { type: string, maxLength: 1024 }
    CameraStreamUrl:
      type: string
      format: uri
      maxLength: 2048
      pattern: '^rtsps?://[^@/?#]+(/[^?#]*)?$'
      description: RTSP URL with a host and an optional path. Use the credentials field for user information.
    Camera:
      type: object
      additionalProperties: false
      required: [id, point_id, name, main_url, secondary_url, has_credentials, desired_revision, applied_revision, state]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        point_id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 256 }
        main_url: { $ref: '#/components/schemas/CameraStreamUrl' }
        secondary_url: { $ref: '#/components/schemas/CameraStreamUrl' }
        has_credentials: { type: boolean }
        desired_revision: { $ref: '#/components/schemas/Revision' }
        applied_revision:
          oneOf:
            - $ref: '#/components/schemas/Revision'
            - type: 'null'
        state: { type: string, enum: [applying, applied, rejected] }
        apply_failure: { type: string, enum: [invalid_configuration, incompatible_profiles, source_unreachable] }
    Point:
      type: object
      required: [id, name, connection, recording]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 256 }
        connection: { type: string, enum: [unknown, online, offline] }
        recording: { type: string, enum: [unknown, current, delayed, stopped] }
        last_recorded_at: { $ref: '#/components/schemas/UtcTime' }
    ArchivePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ArchiveEntry' }
        next_cursor: { $ref: '#/components/schemas/Cursor' }
    ArchiveEntry:
      oneOf:
        - $ref: '#/components/schemas/Recorded'
        - $ref: '#/components/schemas/RecordingGap'
        - $ref: '#/components/schemas/PendingCatalog'
        - $ref: '#/components/schemas/UnavailableRecording'
    Recorded:
      allOf:
        - type: object
          required: [state, interval]
          properties:
            state: { type: string, const: recorded }
            interval: { $ref: '#/components/schemas/UtcInterval' }
        - $ref: '#/components/schemas/TimeQuality'
    TimeQuality:
      oneOf:
        - type: object
          required: [time_basis, uncertainty_us]
          properties:
            time_basis: { type: string, const: source_clock }
            uncertainty_us:
              type: string
              pattern: '^(0|[1-9][0-9]{0,18})$'
        - type: object
          required: [time_basis]
          properties:
            time_basis: { type: string, const: reception }
            uncertainty_us: false
    RecordingGap:
      type: object
      required: [state, interval, reason]
      properties:
        state: { type: string, const: gap }
        interval: { $ref: '#/components/schemas/UtcInterval' }
        reason: { type: string, enum: [source_offline, storage_failure, overload] }
    PendingCatalog:
      type: object
      required: [state, interval]
      properties:
        state: { type: string, const: pending_catalog }
        interval: { $ref: '#/components/schemas/UtcInterval' }
    UnavailableRecording:
      type: object
      required: [state, interval, reason]
      properties:
        state: { type: string, const: unavailable }
        interval: { $ref: '#/components/schemas/UtcInterval' }
        reason: { type: string, enum: [media_offline, corrupt, outside_retention, unknown_coverage] }
    LiveSelection:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, const: live }
    ArchiveSelection:
      type: object
      additionalProperties: false
      required: [mode, interval]
      properties:
        mode: { type: string, const: archive }
        interval: { $ref: '#/components/schemas/UtcInterval' }
    MediaRequest:
      oneOf:
        - $ref: '#/components/schemas/LiveSelection'
        - $ref: '#/components/schemas/ArchiveSelection'
    MediaSession:
      type: object
      required: [id, point_id, selection, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        point_id: { $ref: '#/components/schemas/Id' }
        selection: { $ref: '#/components/schemas/MediaRequest' }
        expires_at: { $ref: '#/components/schemas/UtcTime' }
    PlaybackManifest:
      type: object
      required: [mime_type, parts]
      properties:
        mime_type: { type: string, minLength: 1 }
        parts:
          type: array
          items:
            type: object
            required: [init_id, media_id, interval]
            properties:
              init_id: { $ref: '#/components/schemas/Id' }
              media_id: { $ref: '#/components/schemas/Id' }
              interval: { $ref: '#/components/schemas/UtcInterval' }
    Alert:
      allOf:
        - type: object
          required: [id, point_id, observed_at, type, archive_interval]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            point_id: { $ref: '#/components/schemas/Id' }
            observed_at: { $ref: '#/components/schemas/UtcTime' }
            type: { type: string, minLength: 1, maxLength: 128 }
            archive_interval: { $ref: '#/components/schemas/UtcInterval' }
        - $ref: '#/components/schemas/TimeQuality'
    AlertSnapshot:
      type: object
      required: [items, cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Alert' }
        cursor: { $ref: '#/components/schemas/Cursor' }
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          enum:
            - invalid_request
            - invalid_credentials
            - unauthenticated
            - forbidden
            - not_found
            - idempotency_conflict
            - revision_conflict
            - precondition_required
            - media_session_closed
            - recording_gap
            - pending_catalog
            - media_unavailable
            - rate_limited
            - authorization_unavailable
            - dependency_unavailable
        request_id: { $ref: '#/components/schemas/Id' }
    RevisionConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [current]
          properties:
            status: { const: 412 }
            code: { const: revision_conflict }
            current: { $ref: '#/components/schemas/Camera' }
