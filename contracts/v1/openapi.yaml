openapi: 3.1.0
info:
  title: Bacuri VMS API
  version: 1.2.0
servers:
  - url: /api/v1
security:
  - browserSession: []
paths:
  /sites/{siteId}/users:
    parameters:
    - $ref: '#/components/parameters/Site'
    get:
      operationId: listSiteUsers
      responses:
        '200':
          description: Current policy revision and result.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  revision:
                    type: string
                    pattern: ^[0-9]+$
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessUser'
                required:
                - revision
                - data
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createSiteUser
      parameters:
      - $ref: '#/components/parameters/Csrf'
      - in: header
        name: If-Match
        required: true
        schema:
          type: string
        description: Quoted access policy revision from the last read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '200':
          description: Current policy revision and result.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessChange'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Policy conflict or missing precondition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: Policy conflict or missing precondition.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: Policy conflict or missing precondition.
          content:
