  /session/oidc/methods:
    get:
      operationId: getLoginMethods
      security: []
      responses:
        '200':
          description: Available sign-in methods.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  local:
                    type: boolean
                  oidc:
                    type: boolean
                required:
                - local
                - oidc
  /session/oidc/start:
    get:
      operationId: beginCorporateLogin
      security: []
      responses:
        '303':
          description: Continue sign-in in the same browser.
          headers:
            Location:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /session/oidc/callback:
    get:
      operationId: completeCorporateLogin
      security: []
      responses:
        '303':
          description: Continue sign-in in the same browser.
          headers:
            Location:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - in: query
        name: code
        required: true
        schema:
          type: string
          minLength: 1
      - in: query
        name: state
        required: true
        schema:
          type: string
          minLength: 1
  /sites/{siteId}/alerts/{alertId}/work:
    parameters:
      - { $ref: '#/components/parameters/Site' }
      - { in: path, name: alertId, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      operationId: getAlertWork
      description: Read current state, permitted actions, most recent history and active delegations issued by this user at the point.
      responses:
        '200':
          description: Read current state, permitted actions, most recent history and active delegations issued by this user at the point.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertWork' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: applyAlertCommand
      description: Apply a versioned command. Replay the original receipt for the same principal, key and input while authorized.
      security: [{ browserSession: [] }, { alertDelegation: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { in: header, name: X-CSRF-Token, description: Required for browser sessions., schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertCommand' }
      responses:
        '200':
          description: Apply a versioned command. Replay the original receipt for the same principal, key and input while authorized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertReceipt' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '409':
          description: Stale version, incompatible state or command key reuse.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /sites/{siteId}/alert-audit/search:
    parameters:
      - { $ref: '#/components/parameters/Site' }
    post:
      operationId: searchAlertAudit
      description: Find up to 50 permitted audit entries by alert and literal reason or result substring, newest first.
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
