        '422': { $ref: '#/components/responses/CameraFailure' }
        '502': { $ref: '#/components/responses/CameraFailure' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/CameraFailure' }
  /sites/{siteId}/cameras:
    parameters:
      - $ref: '#/components/parameters/Site'
    get:
      operationId: listCameras
      description: List camera configurations, including desired and applied revisions.
      responses:
        '200':
          description: Site camera configurations visible to its administrator.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Camera' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: registerCamera
      description: Register a camera at the selected point, or create its point when point_id is omitted.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CameraConfiguration'
      responses:
        '201':
          description: Configuration persisted. A replay returns the original result.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            ETag: { $ref: '#/components/headers/Revision' }
            Location:
              required: true
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Camera' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/CameraFailure' }
        '409':
          description: Duplicate device, stale binding or conflicting idempotency key.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sites/{siteId}/cameras/{cameraId}:
    parameters:
      - $ref: '#/components/parameters/Site'
      - name: cameraId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      operationId: getCamera
      responses:
        '200':
          description: Current site camera configuration.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            ETag: { $ref: '#/components/headers/Revision' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Camera' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      operationId: updateCamera
      description: Update the camera. The observation point stays the same.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: If-Match
          in: header
          required: true
          schema: { $ref: '#/components/schemas/StrongRevision' }
      requestBody:
        $ref: '#/components/requestBodies/CameraConfiguration'
      responses:
        '200':
          description: Current configuration after the update.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            ETag: { $ref: '#/components/headers/Revision' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Camera' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CameraFailure' }
        '422': { $ref: '#/components/responses/CameraFailure' }
        '412':
          description: Revision changed. Fetch the camera again before retrying.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            ETag: { $ref: '#/components/headers/Revision' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/RevisionConflict' }
        '428':
          description: Missing If-Match header.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sites/{siteId}/points/{pointId}/audio:
    parameters:
      - $ref: '#/components/parameters/Site'
      - $ref: '#/components/parameters/Point'
    post:
      operationId: exchangeCameraAudio
      description: Exchange mono signed little-endian 16-bit PCM at 8000 Hz under a direction-specific resource grant.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AudioRequest' } } }
      responses:
        '200':
          description: State acknowledged or authorized PCM samples with their UTC start in microseconds.
          content: { application/json: { schema: { $ref: '#/components/schemas/AudioResult' } } }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CameraFailure' }
        '422': { $ref: '#/components/responses/CameraFailure' }
        '502': { $ref: '#/components/responses/CameraFailure' }
  /sites/{siteId}/points/{pointId}/ptz:
    parameters:
      - $ref: '#/components/parameters/Site'
      - $ref: '#/components/parameters/Point'
    get:
      operationId: getCameraControls
      responses:
        '200':
          description: Current binding, supported controls, last observed inputs and recent commands.
          content: { application/json: { schema: { $ref: '#/components/schemas/CameraControls' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CameraFailure' }
        '422': { $ref: '#/components/responses/CameraFailure' }
        '502': { $ref: '#/components/responses/CameraFailure' }
        '504': { $ref: '#/components/responses/CameraFailure' }
    post:
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      operationId: controlPointPtz
      description: Dispatch a supported control for the current device. Continuous pan, tilt and zoom use a one-second device timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id, command]
              properties:
                device_id: { $ref: '#/components/schemas/Id' }
                command: { $ref: '#/components/schemas/PtzCommand' }
                target: { type: string, maxLength: 256 }
      responses:
        '204':
          description: The device acknowledged the command.
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CameraFailure' }
        '422': { $ref: '#/components/responses/CameraFailure' }
        '502': { $ref: '#/components/responses/CameraFailure' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/CameraFailure' }
  /sites/{siteId}/points/{pointId}/exports:
    parameters:
      - { $ref: '#/components/parameters/Site' }
      - { $ref: '#/components/parameters/Point' }
    post:
      operationId: exportFragment
      description: Export recorded frames in a half-open UTC interval of up to one hour under a separate point and interval grant. An alert limits the selection to its binding and context.
      parameters:
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [interval]
              properties:
                interval: { $ref: '#/components/schemas/UtcInterval' }
                alert_id: { $ref: '#/components/schemas/Id' }
                mode: {type: string, enum: [selection, original, derivative]}
                audio: {type: boolean}
                reason: {type: string, minLength: 1, maxLength: 512}
      responses:
        '200':
          description: Tar package containing numbered MP4 files, the source manifest and its detached Ed25519 signature.
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No eligible frames or ambiguous coverage.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: The export exceeds the block or media size limit.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sites/{siteId}/points/{pointId}/archive:
    parameters:
      - $ref: '#/components/parameters/Site'
      - $ref: '#/components/parameters/Point'
    get:
      operationId: searchArchive
      description: Search a half-open UTC interval of at most one hour. Return at most 1000 entries, ordered by start time.
      parameters:
        - {name: presentation, in: query, schema: {type: string, enum: [masked]}}
        - name: start
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UtcTime' }
        - name: end
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UtcTime' }
        - name: cursor
          in: query
          schema: { $ref: '#/components/schemas/Cursor' }
      responses:
        '200':
          description: Known archive intervals. The continuation cursor is bound to the search and current access scope.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchivePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sites/{siteId}/points/{pointId}/media-sessions:
    parameters:
      - $ref: '#/components/parameters/Site'
      - $ref: '#/components/parameters/Point'
    post:
      operationId: createMediaSession
      description: Archive selections cover at most one hour. Return complete independently decodable blocks within the half-open interval. A browser session may hold 16 active media sessions across both modes.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaRequest' }
      responses:
        '201':
          description: Media session scoped to this browser session, point, mode and requested archive interval.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaSession' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Replay mismatch or unavailable media in the requested interval.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /media-sessions/{mediaSessionId}:
    parameters:
      - $ref: '#/components/parameters/MediaSession'
    delete:
      operationId: revokeMediaSession
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: The caller's session is revoked. Absent, closed and foreign sessions return the same response.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /media-sessions/{mediaSessionId}/offer:
    parameters:
      - $ref: '#/components/parameters/MediaSession'
    post:
      operationId: negotiateLiveMedia
      description: Negotiate a WebRTC live session using a complete SDP offer with gathered ICE candidates.
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/sdp:
            schema: { type: string, maxLength: 65536 }
      responses:
        '200':
          description: SDP answer with gathered ICE candidates.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/sdp:
              schema: { type: string, maxLength: 65536 }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The live session already has a peer connection.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410': { $ref: '#/components/responses/MediaSessionClosed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /media-sessions/{mediaSessionId}/manifest:
    parameters:
      - $ref: '#/components/parameters/MediaSession'
    get:
      operationId: getPlaybackManifest
      responses:
        '200':
          description: Authorized MSE playback plan. Parts are relative to the current media session.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackManifest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/MediaSessionClosed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /media-sessions/{mediaSessionId}/parts/{partId}:
    parameters:
      - $ref: '#/components/parameters/MediaSession'
      - name: partId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      operationId: readPlaybackPart
      responses:
        '200':
          description: Authorized initialization or media segment.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/MediaSessionClosed' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /sites/{siteId}/alerts:
    parameters:
      - $ref: '#/components/parameters/Site'
    get:
      operationId: getAlertSnapshot
      responses:
        '200':
          description: Consistent snapshot of the latest 100 visible alerts and its WebSocket resume cursor.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSnapshot' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /sites/{siteId}/alerts/{alertId}/archive:
    parameters:
      - $ref: '#/components/parameters/Site'
      - in: path
        name: alertId
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    get:
      operationId: resolveAlertArchive
      responses:
        '200':
          description: Current archive coverage for the observed binding and time uncertainty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertArchive' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    alertDelegation: { type: http, scheme: bearer }
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-bacuri_session
  parameters:
    Site:
      name: siteId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Point:
      name: pointId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    MediaSession:
      name: mediaSessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { $ref: '#/components/schemas/CsrfToken' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { $ref: '#/components/schemas/Id' }
  headers:
    Revision:
      required: true
      schema: { $ref: '#/components/schemas/StrongRevision' }
    NoStore:
      required: true
      schema: { type: string, const: no-store }
  requestBodies:
    CameraConfiguration:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CameraConfiguration' }
  responses:
    CameraConflict:
      description: Conflicting identity, revision or request contents.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CameraFailure:
      description: Camera transport, authentication, or profile failure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidRequest:
      description: Malformed input, invalid range, configuration or query cursor.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: Invalid credentials, missing or expired session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The operation is forbidden by role, origin or CSRF policy.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource absent or outside the applicable scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MediaSessionClosed:
      description: Media session expired or revoked for its owning browser session.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: A session or request limit has been reached.
      headers:
        Retry-After:
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: A required authorization, catalog or delivery dependency is unavailable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    RecordingRule:
      type: object
      additionalProperties: false
      required:
      - continuous
      - manual
      - event
      - audio
      - zone
      - schedule
      - pre
      - post
      - days
      properties:
        continuous:
          type: boolean
        manual:
          type: boolean
        event:
          type: boolean
        audio:
          type: boolean
        zone:
          type: string
          maxLength: 96
        schedule:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - day
            - start
            - end
            properties:
              day:
                type: integer
                minimum: 1
                maximum: 7
              start:
                type: integer
                minimum: 0
                maximum: 1439
              end:
                type: integer
                minimum: 1
                maximum: 1440
          maxItems: 56
        pre:
          type: integer
          minimum: 0
          maximum: 30
        post:
          type: integer
          minimum: 1
          maximum: 300
        days:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 36500
    RecordingPolicyDraft:
      type: object
      additionalProperties: false
      required:
      - scope
      - target
      - priority
      - rule
      - revision
      properties:
        scope:
          type: string
          enum:
          - point
          - group
        target:
          $ref: '#/components/schemas/Id'
        priority:
          type: integer
          minimum: 0
          maximum: 100
        rule:
          $ref: '#/components/schemas/RecordingRule'
        revision:
          type: string
          pattern: ^[0-9]+$
    RecordingPolicy:
      type: object
      additionalProperties: false
      required:
      - scope
      - target
      - priority
      - rule
      - revision
      - id
      - since
      properties:
        scope:
          type: string
          enum:
          - point
          - group
        target:
          $ref: '#/components/schemas/Id'
        priority:
          type: integer
          minimum: 0
          maximum: 100
        rule:
          $ref: '#/components/schemas/RecordingRule'
        revision:
          type: string
          pattern: ^[0-9]+$
        id:
          $ref: '#/components/schemas/Id'
        since:
          type: integer
          format: int64
    RecordingPolicyList:
      type: object
      additionalProperties: false
      required:
      - policies
      - effective
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/RecordingPolicy'
        effective:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required:
            - id
            - revision
            - since
            - rule
            - windows
            properties:
              id:
                $ref: '#/components/schemas/Id'
              revision:
                type: integer
              since:
                type: integer
                format: int64
              rule:
                $ref: '#/components/schemas/RecordingRule'
              windows:
                type: array
                items:
                  type: array
                  items:
                    type: integer
                    format: int64
    RecordingManualState:
      type: object
      additionalProperties: false
      required:
      - enabled
      - active
      - until_us
      properties:
        enabled:
          type: boolean
        active:
          type: boolean
        until_us:
          type:
          - integer
          - 'null'
    InvestigationBookmark:
      type: object
      additionalProperties: false
      required: [at, name]
      properties:
        at: {$ref: '#/components/schemas/UtcTime'}
        name: {type: string, maxLength: 128}
    CaseMaterialDraft:
      type: object
      additionalProperties: false
      required: [point_id, interval, bookmarks]
      properties:
        point_id: {$ref: '#/components/schemas/Id'}
        interval: {$ref: '#/components/schemas/UtcInterval'}
        bookmarks: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/InvestigationBookmark'}}
    CaseMaterial:
      type: object
      additionalProperties: false
      required: [point_id, interval, bookmarks, hold_id]
      properties:
        point_id: {$ref: '#/components/schemas/Id'}
        interval: {$ref: '#/components/schemas/UtcInterval'}
        bookmarks: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/InvestigationBookmark'}}
        hold_id: {$ref: '#/components/schemas/Id'}
    InvestigationDraft:
      type: object
      additionalProperties: false
      required: [number, assignee, notes, expires_at, revision, reason, materials]
      properties:
        number: {type: string, maxLength: 64}
        assignee: {$ref: '#/components/schemas/Id'}
        notes: {type: string, maxLength: 8192}
        expires_at: {$ref: '#/components/schemas/UtcTime'}
        revision: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        reason: {type: string, maxLength: 512}
        materials: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/CaseMaterialDraft'}}
    Investigation:
      type: object
      additionalProperties: false
      required: [id, number, assignee, notes, expires_at, revision, materials]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        number: {type: string, maxLength: 64}
        assignee: {$ref: '#/components/schemas/Id'}
        notes: {type: string, maxLength: 8192}
        expires_at: {$ref: '#/components/schemas/UtcTime'}
        revision: {$ref: '#/components/schemas/Revision'}
        materials: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/CaseMaterial'}}
    SavedInvestigation:
