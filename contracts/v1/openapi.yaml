        width_m: { type: number, minimum: 0.25, maximum: 40075016.7 }
        bearing: { type: number, minimum: 0, maximum: 360 }
        building: { type: string, minLength: 1, maxLength: 128 }
    GeographicPair:
      type: array
      minItems: 2
      maxItems: 2
      items: { type: number }
    PlanFootprint:
      type: object
      required: [bearing, width_m, corners, center]
      properties:
        bearing: { type: number }
        width_m: { type: number }
        center: { $ref: '#/components/schemas/GeographicPair' }
        corners: { type: array, minItems: 4, maxItems: 4, items: { $ref: '#/components/schemas/GeographicPair' } }
    PlanLink:
      type: object
      required: [plan_id, definition]
      properties:
        plan_id: { $ref: '#/components/schemas/Id' }
        definition: { oneOf: [{ $ref: '#/components/schemas/PlanReference' }, { type: 'null' }] }
    SavePlanLink:
      allOf:
        - { $ref: '#/components/schemas/PlanLink' }
        - type: object
          required: [token, choices]
          properties:
            token: { type: string }
            choices: { type: object, additionalProperties: { enum: [keep, plan] } }
    PlanLinkPreview:
      type: object
      required: [token, cameras]
      properties:
        token: { type: string }
        footprint: { $ref: '#/components/schemas/PlanFootprint' }
        cameras:
          type: array
          items:
            type: object
            required: [point_id, projected]
            properties:
              point_id: { $ref: '#/components/schemas/Id' }
              projected: { $ref: '#/components/schemas/GeographicPair' }
              existing: { $ref: '#/components/schemas/GeographicPair' }
              existing_plan_id: { $ref: '#/components/schemas/Id' }
              distance_m: { type: number }
    FloorPlan:
      type: object
      additionalProperties: false
      required: [id, name, image_url, width, height]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        image_url: { type: string }
        footprint: { $ref: '#/components/schemas/PlanFootprint' }
        building: { type: string }
        definition: { $ref: '#/components/schemas/PlanReference' }
        width: { type: integer }
        height: { type: integer }
    PointCoordinates:
      type: object
      additionalProperties: false
      required: [point_id, plan_id, x, y]
      properties:
        point_id: { $ref: '#/components/schemas/Id' }
        plan_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        x: { type: number }
        y: { type: number }
      if:
        properties: { plan_id: { type: 'null' } }
      then:
        properties:
          x: { minimum: -180, maximum: 180 }
          y: { minimum: -85.051129, maximum: 85.051129 }
      else:
        properties:
          x: { minimum: 0, maximum: 1 }
          y: { minimum: 0, maximum: 1 }
    PointPlacement:
      type: object
      additionalProperties: false
      required: [point_id, plan_id, x, y]
      properties:
        point_id: { $ref: '#/components/schemas/Id' }
        plan_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        x: { type: number }
        y: { type: number }
        source_plan_id: { $ref: '#/components/schemas/Id' }
        camera: { $ref: '#/components/schemas/MapCamera' }
        calibration: { $ref: '#/components/schemas/StoredViewCalibration' }
        view: { $ref: '#/components/schemas/CameraView' }
      if:
        properties: { plan_id: { type: 'null' } }
      then:
        properties:
          x: { minimum: -180, maximum: 180 }
          y: { minimum: -85.051129, maximum: 85.051129 }
      else:
        properties:
          x: { minimum: 0, maximum: 1 }
          y: { minimum: 0, maximum: 1 }
    MapCamera:
      type: object
      additionalProperties: false
      required: [device_id, ptz, profile]
      properties:
        device_id: { $ref: '#/components/schemas/Id' }
        ptz: { type: boolean }
        profile: { type: string }
        revision: { type: string }
        fresh: { type: boolean }
        pan: { type: number }
        tilt: { type: number }
        space: { type: string }
        zoom: { type: number, minimum: 0, maximum: 1 }
        hfov: { type: number }
        moving: { type: boolean }
        observed_at: { type: string, format: date-time }
        source_time: { type: string, format: date-time }
    CameraView:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { enum: [fixed, live, stale, unknown] }
        bearing: { type: number }
        hfov: { type: number }
        estimated: { type: boolean }
        observed_at: { type: string, format: date-time }
    StoredViewCalibration:
      type: object
      additionalProperties: false
      required: [device_id, ptz, bearing, hfov]
      properties:
        device_id: { $ref: '#/components/schemas/Id' }
        ptz: { type: boolean }
        profile: { type: string }
        bearing: { type: number, minimum: 0, maximum: 360 }
        hfov: { type: number, minimum: 0.1, maximum: 179.9 }
        tele_hfov: { type: number, minimum: 0.1, maximum: 179.9 }
        reference_pan: { type: number }
        space: { type: string }
        degrees_per_unit: { type: number }
    ViewCalibrationRequest:
      type: object
      additionalProperties: false
      required: [point_id, plan_id, device_id, bearing, hfov]
      properties:
        point_id: { $ref: '#/components/schemas/Id' }
        plan_id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        device_id: { $ref: '#/components/schemas/Id' }
        bearing: { type: number, minimum: 0, maximum: 360 }
        hfov: { type: number, minimum: 0.1, maximum: 179.9 }
        tele_hfov: { type: number, minimum: 0.1, maximum: 179.9 }
        reference_pan: { type: number, minimum: -1000000000, maximum: 1000000000 }
        space: { type: string }
        degrees_per_unit: { type: number, minimum: -36000, maximum: 36000 }
    PlanUpload:
      type: object
      additionalProperties: false
      required: [name, png]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        png: { type: string, contentEncoding: base64, maxLength: 5592408 }
    CreatedPlan:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/Id' }
    Id:
      type: string
      format: uuid
      pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'
    UtcTime:
      type: string
      format: date-time
      pattern: 'Z$'
    Cursor:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '^[A-Za-z0-9_-]+$'
    CsrfToken:
      type: string
      minLength: 43
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
    Revision:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Positive signed 64-bit integer encoded as decimal text.
    StrongRevision:
      type: string
      pattern: '^"[A-Za-z0-9_-]{1,128}"$'
      description: Strong opaque entity tag for the complete camera representation.
    UtcInterval:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: { $ref: '#/components/schemas/UtcTime' }
        end: { $ref: '#/components/schemas/UtcTime' }
      description: Half-open interval with start strictly earlier than end.
    FactorChallenge:
      type: object
      required: [kind, rp_id, user_id, ticket, challenge]
      properties:
        kind: { type: string, enum: [get, create] }
        rp_id: { type: string }
        user_id: { $ref: '#/components/schemas/Id' }
        ticket: { type: string, minLength: 64, maxLength: 64 }
        challenge: { type: string }
        credential_id: { type: string }
    FactorAnswer:
      type: object
      additionalProperties: false
      required: [ticket, credential_id, client_data, authenticator_data]
      properties:
        ticket: { type: string }
        credential_id: { type: string }
        client_data: { type: string }
        authenticator_data: { type: string }
        signature: { type: string }
    Login:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        enrollment_code: { type: string, minLength: 64, maxLength: 64, writeOnly: true }
    BrowserSession:
      type: object
      required: [user_id, site_roles, expires_at, csrf_token]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        site_roles:
          type: array
          items:
            type: object
            required: [site_id, role]
            properties:
              site_id: { $ref: '#/components/schemas/Id' }
              role: { type: string, enum: [administrator, operator] }
        expires_at: { $ref: '#/components/schemas/UtcTime' }
        csrf_token: { $ref: '#/components/schemas/CsrfToken' }
    CameraConfiguration:
      type: object
      additionalProperties: false
      required: [name, main_url, secondary_url]
      properties:
        point_id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 256 }
        main_url: { $ref: '#/components/schemas/CameraStreamUrl' }
        secondary_url: { $ref: '#/components/schemas/CameraStreamUrl' }
        replace_device_id: { description: Active device to replace at point_id on registration, $ref: '#/components/schemas/Id' }
        onvif_selection: { type: string, maxLength: 24576, writeOnly: true }
        credentials:
          description: Omit to retain existing credentials or use null to remove them.
          writeOnly: true
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 128 }
                password: { type: string, maxLength: 1024 }
    DiscoveredCamera:
      type: object
      required: [endpoint_id, device_service, selection]
      properties:
        endpoint_id: { type: string }
        device_service: { type: string, format: uri }
        selection: { type: string }
    MonitorLayoutDraft:
      type: object
      required: [name, shared, points, revision]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        shared: {type: boolean}
        points: {type: array, minItems: 1, maxItems: 16, uniqueItems: true, items: {$ref: '#/components/schemas/Id'}}
        revision: {type: string, pattern: '^(0|[1-9][0-9]{0,18})$'}
    MonitorLayout:
      type: object
      required: [id, name, shared, editable, points, revision]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        shared: {type: boolean}
        editable: {type: boolean}
        points: {type: array, items: {type: [string, 'null']}}
        revision: {$ref: '#/components/schemas/Revision'}
    CameraInspection:
      type: object
      required: [endpoint_id, manufacturer, model, firmware, serial, ptz, events, selection, profiles]
      properties:
        endpoint_id: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        firmware: { type: string }
        serial: { type: string }
        ptz: { type: boolean }
        events: { type: boolean }
        selection: { type: string }
        profiles:
          type: array
          items:
            type: object
            required: [token, name, url]
            properties:
              token: { type: string }
              codec: {enum: [h264, h265]}
              channel: { type: string }
              width: { type: integer }
              height: { type: integer }
              name: { type: string }
              url: { $ref: '#/components/schemas/CameraStreamUrl' }
    CameraTemplateSettings:
      type: object
      required: [name, record_quality]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        record_quality: { type: string, enum: [high, low] }
        brightness: { type: number }
    CameraTemplate:
      allOf:
        - { $ref: '#/components/schemas/CameraTemplateSettings' }
        - type: object
          required: [id, revision]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            revision: { $ref: '#/components/schemas/Revision' }
    CameraBatchDraft:
      type: object
      additionalProperties: false
      required: [selection, username, password, name]
      oneOf:
        - required: [main_url, secondary_url]
          not: { anyOf: [{ required: [channel] }, { required: [record_quality] }, { required: [template_id] }, { required: [template_revision] }] }
        - required: [record_quality, channel]
          not: { anyOf: [{ required: [main_url] }, { required: [secondary_url] }, { required: [template_id] }, { required: [template_revision] }] }
        - required: [template_id, template_revision, channel]
          not: { anyOf: [{ required: [main_url] }, { required: [secondary_url] }, { required: [record_quality] }, { required: [brightness] }] }
      properties:
        selection: { type: string, maxLength: 24576 }
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, maxLength: 1024, writeOnly: true }
        name: { type: string, minLength: 1, maxLength: 256 }
        point_id: { $ref: '#/components/schemas/Id' }
        main_url: { $ref: '#/components/schemas/CameraStreamUrl' }
        secondary_url: { $ref: '#/components/schemas/CameraStreamUrl' }
        brightness: { type: number }
        record_quality: { type: string, enum: [high, low] }
        channel: { type: string, maxLength: 256 }
        template_id: { $ref: '#/components/schemas/Id' }
        template_revision: { $ref: '#/components/schemas/Revision' }
    BatchChannelSettings:
      type: object
      required: [name, main_url, secondary_url, point_id]
      properties:
        name: { type: string }
        point_id: { type: string, description: Empty when a new observation point will be created. }
        main_url: { type: string }
        secondary_url: { type: string }
    CameraBatchReceipt:
      type: object
      required: [item_id, camera, before, after, brightness, image, expected_revision, revision, state, current]
      properties:
        item_id: { $ref: '#/components/schemas/Id' }
        device_id: { $ref: '#/components/schemas/Id' }
        camera:
          type: object
          required: [endpoint_id, model, manufacturer, firmware, serial, channel_token, ptz, events]
          properties:
            endpoint_id: { type: string }
            model: { type: string }
            manufacturer: { type: string }
            firmware: { type: string }
            serial: { type: string }
            channel_token: { type: string }
            ptz: { type: boolean }
            events: { type: boolean }
        template: { $ref: '#/components/schemas/CameraTemplate' }
        before:
          oneOf: [{ $ref: '#/components/schemas/BatchChannelSettings' }, { type: 'null' }]
        after: { $ref: '#/components/schemas/BatchChannelSettings' }
        brightness: { type: [number, 'null'] }
        image:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [min, max, value]
              properties:
                min: { type: number }
                max: { type: number }
                value: { type: number }
        state: { type: string, enum: [prepared, applying, rolling_back, saved, failed, rollback_failed, rolled_back] }
        error: { type: string }
        observed_brightness: { type: number }
        expected_revision: { type: [string, 'null'] }
        revision: { type: [string, 'null'] }
        current:
          oneOf:
            - { type: 'null' }
            - allOf:
                - { $ref: '#/components/schemas/BatchChannelSettings' }
                - type: object
                  required: [id, desired_revision, applied_revision, binding_revision, state]
                  properties:
                    id: { type: string }
                    desired_revision: { type: string }
                    applied_revision: { type: [string, 'null'] }
                    binding_revision: { type: string }
                    state: { type: string, enum: [applying, applied, rejected] }
    CameraIssues:
      type: object
      required: [main, secondary]
      properties:
        main: { $ref: '#/components/schemas/StreamIssue' }
        secondary: { $ref: '#/components/schemas/StreamIssue' }
    StreamIssue:
      type: string
      enum: [unknown, certificate_error, incompatible]
    BoundRecording:
      type: object
      required: [binding_revision, interval]
      properties:
        binding_revision: { $ref: '#/components/schemas/Revision' }
        interval: { $ref: '#/components/schemas/UtcInterval' }
    CameraStreamUrl:
      type: string
      format: uri
      maxLength: 2048
      pattern: '^rtsps?://[^@/?#]+(/[^?#]*)?(\?(transmode=unicast&profile=[a-zA-Z0-9._-]{1,64}|profile=[a-zA-Z0-9._-]{1,64}(&transmode=unicast)?))?$'
      description: Use RTSPS with a trusted camera certificate. Cleartext RTSP requires an explicit IP exception in the permitted camera segment. Supply credentials separately.
    Camera:
      type: object
      additionalProperties: false
      required: [id, point_id, name, main_url, secondary_url, has_credentials, desired_revision, applied_revision, state]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        point_id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 256 }
        main_url: { $ref: '#/components/schemas/CameraStreamUrl' }
        secondary_url: { $ref: '#/components/schemas/CameraStreamUrl' }
        endpoint_id: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        firmware: { type: string }
        serial: { type: string }
        ptz: { type: boolean }
        events: { type: boolean }
        channel_token: { type: string }
        binding_revision: { $ref: '#/components/schemas/Revision' }
        has_credentials: { type: boolean }
        desired_revision: { $ref: '#/components/schemas/Revision' }
        applied_revision:
          oneOf:
            - $ref: '#/components/schemas/Revision'
            - type: 'null'
        state: { type: string, enum: [applying, applied, rejected] }
        apply_failure: { type: string, enum: [invalid_configuration, incompatible_profiles, source_unreachable] }
    AudioRequest:
      type: object
      additionalProperties: false
      required: [mode, device_id]
      properties:
        mode: { type: string, enum: [listen, record, record_stop, talk, mute, archive] }
        device_id: { $ref: '#/components/schemas/Id' }
        at_us: { type: integer, minimum: 0, maximum: 9007199254740991 }
        session: { $ref: '#/components/schemas/Id' }
        sequence: { type: integer, minimum: 0, maximum: 65535 }
        pcm: { type: string, contentEncoding: base64, maxLength: 11000 }
    AudioResult:
      type: object
      additionalProperties: false
      properties:
        start_us: { type: integer }
        pcm: { type: string, contentEncoding: base64, maxLength: 22000 }
    CameraControls:
      type: object
      required: [device_id, actions, inputs, history]
      properties:
        device_id: { $ref: '#/components/schemas/Id' }
        capability_error: { type: string }
        owner:
          type: object
          required: [name, priority, until]
          properties:
            name: { type: string }
            priority: { type: integer }
            until: { type: string }
        actions:
          type: array
          items:
            type: object
            required: [command, target, label]
            properties:
              command: { $ref: '#/components/schemas/PtzCommand' }
              target: { type: string }
              label: { type: string }
        inputs:
          type: array
          items:
            type: object
            required: [token]
            properties:
              token: { type: string }
              active: { type: boolean }
              observed_at: { type: string }
        history:
          type: array
          items:
            type: object
            required: [actor, command, target, outcome, at]
            properties:
              actor: { type: string }
              command: { $ref: '#/components/schemas/PtzCommand' }
              target: { type: string }
              outcome: { type: string, enum: [acknowledged, unknown, rejected] }
              at: { type: string }
    PtzCommand:
      type: string
      enum: [left, right, up, down, stop, zoom_in, zoom_out, focus_near, focus_far, focus_stop, preset_goto, tour_start, tour_stop, light_on, light_off, wiper_on, wiper_off, relay_on, relay_off]
    Point:
      type: object
      required: [id, name, connection, recording]
      properties:
        access_revision: {type: string}
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 256 }
        connection:
          type: string
          enum: [unknown, online, offline]
          description: Reception of the main stream by the recorder. Unknown while connecting or when the recorder does not answer.
        recording:
          type: string
          enum: [unknown, current, delayed, stopped]
          description: >-
            Derived from the archive catalog. Current means that a recently received frame is already in an available
            block. Delayed means that the policy records now and the stream is received, but no recent block is in the
            catalog. Stopped means that nothing is being recorded now. Unknown means that the recorder does not answer
            and the archive has no recent block.
        recording_reason:
          type: string
          enum: [source_offline, storage_full, no_policy, waiting_event, outside_schedule, waiting_manual, disabled, unassigned, archive_pending, recorder_unavailable]
          description: Cause of a recording state other than current, ordered by what has to be fixed first.
        ptz:
          type: object
          required: [device_id, commands]
          properties:
            device_id: { $ref: '#/components/schemas/Id' }
            commands:
              type: array
              uniqueItems: true
              items: { $ref: '#/components/schemas/PtzCommand' }
        audio:
          type: object
          required: [device_id, listen, archive, record, talk]
          properties:
            device_id: { $ref: '#/components/schemas/Id' }
            listen: { type: boolean }
            archive: { type: boolean }
            record: { type: boolean }
            talk: { type: boolean }
        can_record: { type: boolean }
        can_export: { type: boolean }
        last_recorded_at: { $ref: '#/components/schemas/UtcTime' }
    ArchivePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ArchiveEntry' }
        next_cursor: { $ref: '#/components/schemas/Cursor' }
    ArchiveEntry:
      oneOf:
        - $ref: '#/components/schemas/Recorded'
        - $ref: '#/components/schemas/RecordingGap'
        - $ref: '#/components/schemas/PendingCatalog'
        - $ref: '#/components/schemas/UnavailableRecording'
    Recorded:
      allOf:
        - type: object
          required: [state, interval]
          properties:
            state: { type: string, const: recorded }
            interval: { $ref: '#/components/schemas/UtcInterval' }
        - $ref: '#/components/schemas/TimeQuality'
    TimeQuality:
      oneOf:
        - type: object
          required: [time_basis, uncertainty_us]
          properties:
            time_basis: { type: string, const: source_clock }
            uncertainty_us:
              type: string
              pattern: '^(0|[1-9][0-9]{0,18})$'
        - type: object
          required: [time_basis]
          properties:
            time_basis: { type: string, const: reception }
            uncertainty_us: false
    RecordingGap:
      type: object
      required: [state, interval, reason]
      properties:
        state: { type: string, const: gap }
        interval: { $ref: '#/components/schemas/UtcInterval' }
        reason: { type: string, enum: [source_offline, storage_failure, overload, keyframe_interval] }
    PendingCatalog:
      type: object
      required: [state, interval]
      properties:
        state: { type: string, const: pending_catalog }
        interval: { $ref: '#/components/schemas/UtcInterval' }
    UnavailableRecording:
      type: object
      required: [state, interval, reason]
      properties:
        state: { type: string, const: unavailable }
        interval: { $ref: '#/components/schemas/UtcInterval' }
        reason: { type: string, enum: [media_offline, corrupt, outside_retention, unknown_coverage] }
    LiveSelection:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { type: string, const: live }
        quality: {enum: [auto, main, secondary]}
        hevc: {type: boolean, description: Client can decode native HEVC for this delivery mode.}
        accept_masked: {type: boolean, description: Accept server-masked video when the applicable privacy policy defines image regions.}
        cell_width: {type: integer, minimum: 1, maximum: 16384}
        bandwidth_kbps: {type: integer, minimum: 1, maximum: 1000000}
    ArchiveSelection:
      type: object
      additionalProperties: false
      required: [mode, interval]
      properties:
        binding_revision: { $ref: '#/components/schemas/Revision' }
        mode: { type: string, const: archive }
        hevc: {type: boolean, description: Client can decode native HEVC for this delivery mode.}
        accept_masked: {type: boolean, description: Accept server-masked video when the applicable privacy policy defines image regions.}
        interval: { $ref: '#/components/schemas/UtcInterval' }
    MediaRequest:
      oneOf:
        - $ref: '#/components/schemas/LiveSelection'
        - $ref: '#/components/schemas/ArchiveSelection'
    MediaSession:
      type: object
      required: [id, point_id, selection, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        point_id: { $ref: '#/components/schemas/Id' }
        video:
          type: object
          required: [profile, codec, source_codec, width, height, bitrate_kbps, converted]
          properties:
            profile: {enum: [main, secondary]}
            codec: {enum: [h264, h265]}
            source_codec: {enum: [h264, h265]}
            width: {type: integer}
            height: {type: integer}
            bitrate_kbps: {type: integer}
            converted: {type: boolean}
            reason: {enum: [bandwidth, compatibility_copy, compatible_profile, privacy_mask]}
        selection: { $ref: '#/components/schemas/MediaRequest' }
        expires_at: { $ref: '#/components/schemas/UtcTime' }
    PlaybackManifest:
      type: object
      required: [mime_type, parts]
      properties:
        mime_type: { type: string, minLength: 1 }
        parts:
          type: array
          items:
            type: object
            required: [init_id, media_id, interval]
            properties:
              init_id: { $ref: '#/components/schemas/Id' }
              media_id: { $ref: '#/components/schemas/Id' }
              codec: {enum: [h264, h265]}
              source_codec: {enum: [h264, h265]}
              interval: { $ref: '#/components/schemas/UtcInterval' }
    Alert:
      allOf:
        - type: object
          required: [id, point_id, observed_at, type, archive_interval]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            point_id: { $ref: '#/components/schemas/Id' }
            work_state: { $ref: '#/components/schemas/AlertState' }
            observed_at: { $ref: '#/components/schemas/UtcTime' }
            type:
              description: Observation type that raised the alert. Only motion observations raise alerts.
              type: string
              enum: [motion]
            archive_interval: { $ref: '#/components/schemas/UtcInterval' }
        - $ref: '#/components/schemas/TimeQuality'
    AlertArchive:
      type: object
      required: [point_id, state, archive_interval]
      properties:
        point_id: { $ref: '#/components/schemas/Id' }
        archive_interval: { $ref: '#/components/schemas/UtcInterval' }
        state: { enum: [ready, pending_catalog, uncertain_time, gap, unavailable] }
      oneOf:
        - required: [interval, position]
          properties:
            state: { const: ready }
            interval: { $ref: '#/components/schemas/UtcInterval' }
            position: { $ref: '#/components/schemas/UtcTime' }
        - properties:
            state: { enum: [pending_catalog, uncertain_time] }
        - required: [reason]
          properties:
            state: { const: gap }
            reason: { enum: [source_offline, storage_failure, overload, keyframe_interval] }
        - required: [reason]
          properties:
            state: { const: unavailable }
            reason: { enum: [unknown_coverage, media_offline, corrupt, outside_retention] }
    AlertSnapshot:
      type: object
      required: [items, cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Alert' }
        cursor: { $ref: '#/components/schemas/Cursor' }
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          enum:
            - invalid_request
            - camera_tls_error
            - camera_transport_denied
            - camera_unavailable
            - camera_selection_expired
            - camera_incompatible_profiles
            - camera_already_registered
            - camera_command_unsent
            - camera_command_rejected
            - camera_ptz_unknown
            - camera_ptz_busy
            - camera_audio_missing
            - camera_audio_unavailable
            - camera_audio_unsupported
            - camera_ptz_unsupported
            - camera_protocol_error
            - camera_authentication_failed
            - camera_batch_limit
            - camera_image_unsupported
            - camera_image_unconfirmed
            - camera_binding_conflict
            - camera_discovery_unavailable
            - account_conflict
            - group_conflict
            - grant_conflict
            - last_administrator
            - identity_conflict
            - invalid_identity
            - identity_unavailable
            - policy_conflict
            - invalid_factor
            - enrollment_required
            - invalid_credentials
            - unauthenticated
            - forbidden
            - alert_state_conflict
            - alert_result_required
            - not_found
            - idempotency_conflict
            - revision_conflict
            - recording_policy_managed
            - manual_recording_disabled
            - precondition_required
            - media_session_closed
            - recording_gap
            - pending_catalog
            - export_too_large
            - media_unavailable
            - rate_limited
            - video_source_unavailable
            - video_transcoder_limit
            - video_bandwidth_limit
            - video_session_limit
            - authorization_unavailable
            - dependency_unavailable
        request_id: { $ref: '#/components/schemas/Id' }
    RevisionConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [current]
          properties:
            status: { const: 412 }
            code: { const: revision_conflict }
            current: { $ref: '#/components/schemas/Camera' }
