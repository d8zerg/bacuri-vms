syntax = "proto3";

package bacuri.vms.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// The media node owns the hardware and the last completed measurement.
service NodeAcceleration {
  // Renew one task reservation. Stop using the GPU by the lease deadline, even on RPC failure.
  rpc ScheduleTask(TaskUpdate) returns (TaskAssignment);
  rpc ProbeStatus(NodeProbeRequest) returns (NodeProbeStatus);
  rpc StartProbe(NodeProbeRequest) returns (NodeProbeStatus);
  rpc CancelProbe(NodeProbeRequest) returns (NodeProbeStatus);
}
message NodeProbeRequest {
  string node_id = 1;
  string probe_id = 2;
  bool prepare_gpu = 3;
  // Re-read the hardware fingerprint before evaluating GPU settings.
  bool refresh_identity = 4;
}
message NodeProbeStatus { string status_json = 1; }

message TaskUpdate {
  string node_id = 1;
  // Unique per worker execution, including retries of the same execution.
  string task_id = 2;
  string task_kind = 3;
  // Background work may wait when the worker has no CPU capacity.
  bool wait_for_gpu = 4;
  // A report attests that the previous GPU pipeline has already released this grant.
  string released_grant = 5;
  enum Report {
    POLL = 0;
    RELEASED = 1;
    SESSION_LIMIT = 2;
    DEVICE_LOST = 3;
    DRIVER_RESET = 4;
    ENCODER_ERROR = 5;
    FINISHED = 6;
  }
  Report report = 6;
}
message TaskAssignment {
  // Device ID, cpu or queue. A fallback reply may carry a grant still awaiting release.
  string device_id = 1;
  string grant = 2;
  string reason = 3;
  // Relative to the start of the worker's call.
  uint32 valid_for_ms = 4;
}
message NodePolicy {
  string mode = 1;
  repeated string gpu_tasks = 2;
}

service RecorderControl {
  // Persist the accepted configuration before returning APPLIED.
  // A replay of the same site, node and revision returns the recorded decision.
  rpc ApplyConfiguration(ApplyConfigurationRequest) returns (ApplyConfigurationResult);
  rpc ExchangeAudio(AudioRequest) returns (AudioChunk);
  rpc GetVideoProfiles(PointKey) returns (VideoProfiles);
  rpc GetCameraIssues(CameraIssueQuery) returns (CameraIssues);
  rpc GetStorageStatus(RetentionQuery) returns (StorageStatus);
  rpc RecoverGap(EdgeReplayRequest) returns (EdgeReplayResult);
  rpc ListPending(PendingQuery) returns (PendingIntervals);
  // Reports stream reception, policy selection and storage capacity without reading the archive.
  rpc GetPointStates(PointStatesQuery) returns (PointStates);
}

message PointStatesQuery {
  string site_id = 1;
}
enum SourceState {
  SOURCE_STATE_UNSPECIFIED = 0;
  // Frames of the main profile arrived recently.
  SOURCE_STATE_RECEIVING = 1;
  // The first connection attempt has not finished.
  SOURCE_STATE_CONNECTING = 2;
  // The stream failed, stalled or is waiting for a keyframe after a discontinuity.
  SOURCE_STATE_OFFLINE = 3;
}
enum RecordingSelection {
  RECORDING_SELECTION_UNSPECIFIED = 0;
  // The recording policy selects the current moment.
  RECORDING_SELECTION_SELECTED = 1;
  RECORDING_SELECTION_AWAITING_POLICY = 2;
  RECORDING_SELECTION_WAITING_EVENT = 3;
  RECORDING_SELECTION_OUTSIDE_SCHEDULE = 4;
  RECORDING_SELECTION_WAITING_MANUAL = 5;
  RECORDING_SELECTION_DISABLED = 6;
  // The point has no camera binding on this recorder.
  RECORDING_SELECTION_UNBOUND = 7;
}
enum StorageCapacity {
  STORAGE_CAPACITY_UNSPECIFIED = 0;
  STORAGE_CAPACITY_NORMAL = 1;
  STORAGE_CAPACITY_LOW_SPACE = 2;
  // Free space reached the reserve and new blocks are rejected.
  STORAGE_CAPACITY_RECORDING_STOPPED = 3;
}
message PointState {
  string point_id = 1;
  int64 binding_revision = 2;
  SourceState source = 3;
  RecordingSelection selection = 4;
  // Longest expected delay between a frame and its catalogued block: the keyframe interval limit
  // plus the pre-event buffer of event and manual recording.
  int64 publication_lag_us = 5;
}
message PointStates {
  repeated PointState points = 1;
  StorageCapacity capacity = 2;
}

message EdgeReplayRequest {
  PointKey point = 1;
  string device_id = 2;
  int64 binding = 3;
  string recording_id = 4;
  string uri = 5;
  int64 begin_us = 6;
  int64 end_us = 7;
  int64 offset_us = 8;
  int64 uncertainty_us = 9;
}
message EdgeReplayResult {
  uint32 blocks = 1;
  int64 duration_us = 2;
  // copied, partial, no_frames, timeout or quota. Partial means that the time budget ended before
  // the requested end and copying continues from covered_until_us.
  string outcome = 3;
  // End of the newest copied block, or zero when nothing was copied.
  int64 covered_until_us = 4;
}

message AudioRequest {
  string site_id = 1;
  string point_id = 2;
  string device_id = 3;
  enum Mode { UNSPECIFIED = 0; LISTEN = 1; RECORD = 2; TALK = 3; MUTE = 4; ARCHIVE = 5; RECORD_STOP = 6; }
  Mode mode = 4;
  int64 at_us = 5;
  bytes pcm = 6;
  string block_id = 7;
  string sha256 = 8;
  uint32 length = 9;
  string operator_id = 10;
  string talk_session_id = 11;
  uint32 talk_ttl_ms = 12;
}
message AudioChunk { int64 start_us = 1; bytes pcm = 2; }

message CameraIssueQuery {
  string site_id = 1;
  string device_id = 2;
}
enum StreamIssue {
  STREAM_ISSUE_UNSPECIFIED = 0;
  STREAM_ISSUE_TLS = 1;
  STREAM_ISSUE_INCOMPATIBLE = 2;
}
message CameraIssues {
  StreamIssue main = 1;
  StreamIssue secondary = 2;
}

message VideoProfile {
  bool main = 1;
  string codec = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 bitrate_kbps = 5;
}
message VideoProfiles { repeated VideoProfile profiles = 1; }
message PreviewRequest { PointKey point = 1; bool main = 2; }

// Dedicated recorder socket, accessible to the delivery process.
service PreviewSource {
  rpc SubscribeProfile(PreviewRequest) returns (stream PreviewFrame);
  rpc Subscribe(PointKey) returns (stream PreviewFrame);
}
message PreviewFrame {
  bytes access_unit = 1; // Annex B, one access unit, up to 1 MiB.
  bool keyframe = 2;
  string codec = 3;
}
service LiveDelivery {
  rpc Negotiate(LiveOffer) returns (LiveAnswer);
  // Stop the owning browser's live transport and release its delivery slot before acknowledging.
  rpc Close(LiveSessionRef) returns (google.protobuf.Empty);
}
message LiveOffer {
  AuthorizeDeliveryRequest scope = 1;
  string sdp = 2;
}
message LiveAnswer { string sdp = 1; }
message LiveSessionRef {
  string media_session_id = 1;
  string browser_session_id = 2;
}

service ArchiveDelivery {
  // One verified initialization or media segment, in bounded chunks.
  rpc ReadPart(ReadPartRequest) returns (stream PartChunk);
}

message ReadPartRequest {
  AuthorizeDeliveryRequest scope = 1;
  string block_id = 2;
  string sha256 = 3;
  bool initialization = 4;
  // For a complete block the catalog manifest must match the manifest on the volume.
  string complete_block_manifest = 5;
}

message PartChunk {
  uint64 total_bytes = 1;
  bytes data = 2;
}

service ArchiveCatalog {
  // Acknowledge only after the catalog transaction commits.
  rpc RegisterBlock(RegisterBlockRequest) returns (RegistrationResult);
  rpc ReportMotion(SubmitObservationRequest) returns (RegistrationResult);
  rpc NextIndex(RetentionQuery) returns (IndexJob);
  rpc CommitIndex(IndexResult) returns (google.protobuf.Empty);
  rpc RegisterGap(RegisterGapRequest) returns (RegistrationResult);
  // Commit the catalog cutoff before authorizing local reclamation.
  rpc AdvanceRetention(RetentionQuery) returns (RetentionPolicy);
}

service ObservationIngest {
  // Derive the allowed site and source from the caller identity.
  // Acknowledge only after the durable observation transaction commits.
  rpc SubmitObservation(SubmitObservationRequest) returns (RegistrationResult);
}

service MediaAuthorization {
  // Return the committed acceleration policy of this local media node.
  rpc GetNodePolicy(NodeProbeRequest) returns (NodePolicy);
  // Check the current rights of the owning browser session and the entire selection.
  // UNAUTHENTICATED, PERMISSION_DENIED, NOT_FOUND and FAILED_PRECONDITION deny access.
  // UNAVAILABLE or DEADLINE_EXCEEDED never grants or renews a lease.
  rpc AuthorizeDelivery(AuthorizeDeliveryRequest) returns (DeliveryLease);
  // Idempotently release the negotiated live session when its transport ends.
  rpc CloseLive(AuthorizeDeliveryRequest) returns (google.protobuf.Empty);
}

message PendingQuery {
  PointKey point = 1;
  int64 begin_us = 2;
  int64 end_us = 3;
  optional int64 binding_revision = 4;
  // Filter individual blocks before coalescing adjacent pending intervals.
  optional sint64 retention_cutoff_us = 5;
}
message Coverage { int64 begin_us = 1; int64 end_us = 2; }
message IndexJob {
  string manifest = 1;
}
message IndexResult {
  string manifest = 1;
  string analysis = 2;
}

message RegisterGapRequest {
  PointKey point = 1; string recording_node_id = 2; int64 binding_revision = 3;
  Coverage interval = 4; string reason = 5;
}
message PendingIntervals { repeated Coverage intervals = 1; }

message PointKey {
  string site_id = 1;
  string point_id = 2;
}

message ApplyConfigurationRequest {
  string site_id = 1;
  string recording_node_id = 2;
  int64 revision = 3;
  repeated CameraConfiguration cameras = 4;
}

message CameraConfiguration {
  string device_id = 1;
  string point_id = 2;
  string main_url = 3;
  string secondary_url = 4;
  CameraCredentials credentials = 5;
  string channel_id = 6;
  string main_profile_id = 7;
  int64 binding_revision = 8;
}

message CameraCredentials {
  string username = 1;
  string password = 2;
}

message ApplyConfigurationResult {
  int64 requested_revision = 1;
  optional int64 applied_revision = 2;
  ApplyState state = 3;
  optional ApplyFailure failure = 4;
}

enum ApplyState {
  APPLY_STATE_UNSPECIFIED = 0;
  APPLY_STATE_APPLIED = 1;
  APPLY_STATE_REJECTED = 2;
}

enum ApplyFailure {
  APPLY_FAILURE_UNSPECIFIED = 0;
  APPLY_FAILURE_STALE_REVISION = 1;
  APPLY_FAILURE_INVALID_CONFIGURATION = 2;
  APPLY_FAILURE_INCOMPATIBLE_PROFILES = 3;
  APPLY_FAILURE_SOURCE_UNREACHABLE = 4;
}

message RetentionQuery {
  bool supports_holds = 3;
  string site_id = 1;
  string recording_node_id = 2;
}

message StorageStatus { string status_json = 1; }
message RetentionPolicy {
  repeated string protected_blocks = 6;
  optional string recording_plan_json = 4;
  map<string,sint64> point_cutoffs = 5;
  sint64 cutoff_us = 1;
  int32 days = 2;
  int32 reserve_percent = 3;
  repeated string detector_points = 11;
  bool retirement_suspended = 12;
}

message RegisterBlockRequest {
  // UTF-8 JSON block manifest. Its version and content define the block identity.
  bytes manifest_json = 1;
  // An existing immutable manifest may be marked missing/corrupt after volume reconciliation.
  BlockAvailability availability = 2;
  // Generation of the volume owner that verified availability. Zero uses the block generation.
  int64 verification_generation = 3;
}

enum BlockAvailability {
  BLOCK_AVAILABILITY_VERIFIED = 0;
  BLOCK_AVAILABILITY_MISSING = 1;
  BLOCK_AVAILABILITY_CORRUPT = 2;
}

message SubmitObservationRequest {
  string site_id = 1;
  string source_id = 2;
  string observation_id = 3;
  string type = 4;
  int32 schema_version = 5;
  optional sint64 source_time_us = 6;
  BindingReference binding = 7;
  // UTF-8 JSON object for the declared observation type and version.
  bytes attributes_json = 8;
  // Present only when source_time_us is synchronized to UTC in this epoch.
  message ClockReference { string epoch_id = 1; uint64 uncertainty_us = 2; }
  ClockReference clock = 9;
}

message BindingReference {
  string point_id = 1;
  int64 revision = 2;
}

message RegistrationResult {
  RegistrationState state = 1;
}

enum RegistrationState {
  REGISTRATION_STATE_UNSPECIFIED = 0;
  REGISTRATION_STATE_COMMITTED = 1;
  REGISTRATION_STATE_REPLAYED = 2;
  // The archive cutoff already covers this delivery.
  REGISTRATION_STATE_RETIRED = 3;
}

message AuthorizeDeliveryRequest {
  string media_session_id = 1;
  // Internal identity asserted by the authenticated HTTPS entry point.
  string browser_session_id = 2;
  PointKey point = 3;
  oneof selection {
    LiveSelection live = 4;
    UtcInterval archive = 5;
  }
  string privacy_regions = 6;
  bool archive_h264 = 7;
  bool export_source = 8;
}

message LiveSelection { bool main = 1; string source_codec = 2; string output_codec = 3; }

message UtcInterval {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message DeliveryLease {
  // Positive and at most 5000. Count down from the caller's monotonic RPC start.
  // Bound it by the remaining browser and media session lifetimes.
  uint32 valid_for_ms = 1;
}
