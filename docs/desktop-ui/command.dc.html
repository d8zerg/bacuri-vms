<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#12110f}
a{color:#b4a989}a:hover{color:#d8cfb0}
button{font:inherit;cursor:pointer}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
input::placeholder{color:#8d8776}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 900px; background: #12110f; color: #e8e3d9; font-family: Inter, system-ui, sans-serif; font-size: 13px; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="height: 44px; background: #1a1917; border-bottom: 1px solid #2c2a27"></div>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 8px 8px 8px 60px">
      <sc-for list="{{wall}}" as="w" hint-placeholder-count="16"><div style="{{w}}"></div></sc-for>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(12,11,10,.58)"></div>

  <div role="dialog" aria-label="Command line" style="position: absolute; left: 50%; top: 96px; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); background: #1e1e1e; border: 1px solid #3a3835; border-radius: 12px; box-shadow: 0 24px 64px rgba(0,0,0,.55); overflow: hidden">
    <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #2c2a27">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a6a6a6" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="cmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Command or object</label>
      <input id="cmd" value="{{query}}" onChange="{{onQuery}}" onKeyDown="{{onKey}}" placeholder="Camera, time, action, alarm, layout" autocomplete="off" style="flex: 1; height: 28px; background: transparent; border: 0; outline: none; color: #e8e3d9; font: inherit; font-size: 17px">
      <span class="mono" style="font-size: 11px; padding: 2px 6px; border: 1px solid #3a3835; border-radius: 5px; color: #a6a6a6">Esc</span>
    </div>
    <sc-if value="{{hasLayoutFix}}" hint-placeholder-val="{{false}}">
      <div style="padding: 8px 16px; background: #252526; color: #a6a6a6; border-bottom: 1px solid #2c2a27">Keyboard layout corrected: searching for “<span style="color: #e8e3d9">{{fixed}}</span>»</div>
    </sc-if>
    <div style="max-height: 520px; overflow: auto; padding: 6px 0">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div style="padding: 8px 16px 4px; color: #8d8776; font-size: 12px; font-weight: 500">{{g.title}}</div>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <button onClick="{{r.pick}}" style="{{r.style}}">
            <span style="{{r.badge}}">{{r.kind}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
              <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span>
              <span style="color: #8d8776; font-size: 12px">{{r.sub}}</span>
            </span>
            <span class="mono" style="color: #8d8776; font-size: 11px">{{r.hint}}</span>
          </button>
        </sc-for>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
        <div style="padding: 24px 16px; color: #a6a6a6">Nothing found among the objects you are allowed to see</div>
      </sc-if>
    </div>
    <div style="display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-top: 1px solid #2c2a27; color: #8d8776; font-size: 12px">
      <span><span class="mono">Up Down</span> select</span>
      <span><span class="mono">Enter</span> run</span>
      <span><span class="mono">Tab</span> refine</span>
      <span style="flex: 1"></span>
      <div role="group" aria-label="Language" style="display: flex; gap: 2px; padding: 2px; background: #121110; border: 1px solid #2c2a27; border-radius: 7px"><button data-language="en" aria-pressed="true" style="height: 22px; padding: 0 8px; border: 0; border-radius: 5px; background: #504a37; color: #f0ece6; font-size: 11px; font-weight: 600">EN</button><button data-language="ru" aria-pressed="false" style="height: 22px; padding: 0 8px; border: 0; border-radius: 5px; background: transparent; color: #a6a6a6; font-size: 11px; font-weight: 600">RU</button></div>
      <span>{{status}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: (typeof window !== 'undefined' && window.bacuriLanguage && window.bacuriLanguage() === 'ru') ? 'склад 14:30' : 'warehouse 14:30', sel: 0, done: '' };
  }
  renderVals() {
    var self = this;
    var T = (typeof window !== 'undefined' && window.bacuriText) ? window.bacuriText : function (s) { return s; };
    var russian = typeof window !== 'undefined' && window.bacuriLanguage && window.bacuriLanguage() === 'ru';
    var en = "qwertyuiop[]asdfghjkl;'zxcvbnm,.`";
    var ru = 'йцукенгшщзхъфывапролджэячсмитьбюё';
    function fix(s) {
      var out = '';
      for (var i = 0; i < s.length; i++) { var k = en.indexOf(s[i]); out += k >= 0 ? ru[k] : s[i]; }
      return out;
    }
    function unfix(s) {
      var out = '';
      for (var i = 0; i < s.length; i++) { var k = ru.indexOf(s[i]); out += k >= 0 ? en[k] : s[i]; }
      return out;
    }
    var raw = (this.state.query || '').toLowerCase();
    var time = raw.match(/(\d{1,2})[:\s](\d{2})/);
    var text = raw.replace(/(\d{1,2})[:\s](\d{2})/, '').trim();
    var latin = text.length > 0 && (russian ? /^[a-z\[\];',.`\s]+$/.test(text) : /[а-яё]/.test(text));
    var fixed = latin ? (russian ? fix(text) : unfix(text)) : text;
    var cams = [
      ['Warehouse 2 · Gate', 'North terminal · online'], ['Warehouse 2 · Racks', 'North terminal · alarm'], ['Warehouse 1 · Ramp', 'South terminal · online'],
      ['Corridor B2', 'North terminal · online'], ['Entrance A · Turnstiles', 'North terminal · PTZ'], ['Parking P2', 'North terminal · offline'], ['Checkpoint · Entry', 'North terminal · online']
    ];
    var actions = [
      ['Switch the whole layout to the archive', 'All cameras at one moment', 'Space'], ['Accept the next alarm', 'Queue: 4', 'N'], ['Queue an export', 'Selected interval', 'E'],
      ['Switch the language to Russian', 'Interface and help', ''], ['Help: PTZ camera busy', 'Code camera_ptz_busy', 'F1']
    ];
    var layouts = [['Warehouse', '12 cameras · shared'], ['Perimeter', '14 cameras · personal'], ['Entrance', '6 cameras · shared']];
    var alarms = [['Motion in a closed zone', 'Warehouse 2 · Racks · 14:31:59'], ['Connection lost', 'Parking P2 · 14:31:53']];
    function local(rows) { return rows.map(function (r) { return [T(r[0]), T(r[1]), r[2]]; }); }
    cams = local(cams); actions = local(actions); layouts = local(layouts); alarms = local(alarms);
    function hit(s) { return !fixed || s.toLowerCase().indexOf(fixed) >= 0; }
    var groups = [];
    var flat = [];
    function add(title, rows) { if (rows.length) { groups.push({ title: T(title), rows: rows }); rows.forEach(function (r) { flat.push(r); }); } }
    var camHits = cams.filter(function (c) { return hit(c[0]); });
    if (time && camHits.length) {
      var t = (time[1].length < 2 ? '0' : '') + time[1] + ':' + time[2];
      add('Go to', camHits.slice(0, 2).map(function (c) { return { kind: 'Archive', label: T(c[0]) + T(' at ') + t, sub: T('Today, site local time'), hint: 'Enter' }; }).concat([{ kind: 'Archive', label: T('Whole layout “Warehouse” at') + ' ' + t, sub: T('In sync, 12 cameras'), hint: 'Shift Enter' }]));
    }
    add('Cameras', camHits.slice(0, 4).map(function (c) { return { kind: 'Camera', label: c[0], sub: c[1], hint: '' }; }));
    add('Layouts', layouts.filter(function (l) { return hit(l[0]); }).map(function (l) { return { kind: 'Layout', label: l[0], sub: l[1], hint: '' }; }));
    add('Alarms', alarms.filter(function (a) { return hit(a[0]) || hit(a[1]); }).map(function (a) { return { kind: 'Alarm', label: a[0], sub: a[1], hint: '' }; }));
    add('Actions', actions.filter(function (a) { return hit(a[0]) || hit(a[1]); }).map(function (a) { return { kind: 'Action', label: a[0], sub: a[1], hint: a[2] }; }));
    var sel = Math.min(this.state.sel, Math.max(flat.length - 1, 0));
    var badgeColor = { 'Archive': '#373428;color:#e3dabd', 'Camera': '#252526;color:#d8d2c4', 'Layout': '#252526;color:#d8d2c4', 'Alarm': '#452927;color:#ffd6d4', 'Action': '#2c3023;color:#bfcba4' };
    flat.forEach(function (r, i) {
      r.badge = 'flex: 0 0 76px; text-align: center; padding: 2px 0; border-radius: 5px; font-size: 11px; background: ' + badgeColor[r.kind];
      r.kind = T(r.kind);
      r.style = 'width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border: 0; text-align: left; color: #e8e3d9; background: ' + (i === sel ? '#373428; box-shadow: inset 2px 0 0 #b4a989' : 'transparent');
      r.pick = function () { self.setState({ sel: i, done: T('Done:') + ' ' + r.label }); };
    });
    var wall = [];
    var tones = ['#3d3a33', '#2a3036', '#55534c', '#59626a', '#1f2328', '#4a463d', '#34332f', '#2f3337'];
    for (var w = 0; w < 16; w++) wall.push('border-radius: 5px; background: linear-gradient(180deg,' + tones[w % 8] + ' 0%, #1d1c1a 100%)');
    return {
      query: this.state.query,
      groups: groups,
      empty: flat.length === 0,
      hasLayoutFix: latin,
      fixed: fixed,
      wall: wall,
      status: this.state.done || (T('Found:') + ' ' + flat.length),
      onQuery: function (e) { self.setState({ query: e.target.value, sel: 0, done: '' }); },
      onKey: function (e) {
        if (e.key === 'ArrowDown') { e.preventDefault(); self.setState({ sel: Math.min(sel + 1, flat.length - 1) }); }
        if (e.key === 'ArrowUp') { e.preventDefault(); self.setState({ sel: Math.max(sel - 1, 0) }); }
        if (e.key === 'Enter' && flat[sel]) { e.preventDefault(); self.setState({ done: T('Done:') + ' ' + flat[sel].label }); }
      }
    };
  }
}
</script>
</body>
</html>
