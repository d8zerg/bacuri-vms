<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пост из трёх мониторов и пульт</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 48px; display: flex; flex-direction: column; gap: 36px; background: #161513; color: #e8e3d9; font-family: Inter, system-ui, sans-serif; font-size: 13px">

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
    <sc-for list="{{screens}}" as="s" hint-placeholder-count="3">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
        <div style="padding: 10px; background: #0c0b0a; border-radius: 10px; box-shadow: 0 0 0 1px #2c2a27">
          <div style="aspect-ratio: 16 / 9; display: grid; gap: 3px; background: #12110f; border-radius: 3px; overflow: hidden; {{s.grid}}">
            <sc-for list="{{s.tiles}}" as="t" hint-placeholder-count="9"><div style="{{t}}"></div></sc-for>
          </div>
        </div>
        <div style="width: 64px; height: 18px; margin: -12px auto 0; background: #22211e; border-radius: 0 0 6px 6px"></div>
        <figcaption style="display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: baseline; gap: 8px"><span class="mono" style="color: #8d8776">{{s.n}}</span><span style="font-size: 16px; font-weight: 600">{{s.title}}</span></span>
          <span style="color: #a6a6a6; line-height: 1.5">{{s.text}}</span>
        </figcaption>
      </figure>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: 1.2fr .7fr 1fr; gap: 24px; align-items: start">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="padding: 14px; background: #1e1e1e; border: 1px solid #2c2a27; border-radius: 12px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="15">
          <div style="{{k.style}}"><span style="font-size: 11px; line-height: 1.2; text-align: center">{{k.label}}</span></div>
        </sc-for>
      </div>
      <figcaption style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 600">Клавишная панель</span><span style="color: #a6a6a6; line-height: 1.5">Подписи на кнопках меняются по выбранной камере: у PTZ-камеры - предустановки, у неподвижной - соседние камеры. Назначения берутся из общего реестра команд.</span></figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="height: 196px; display: grid; place-items: center; background: #1e1e1e; border: 1px solid #2c2a27; border-radius: 12px">
        <svg width="150" height="160" viewBox="0 0 150 160" role="img" aria-label="Джойстик с осью зума и колесом архива">
          <rect x="15" y="110" width="120" height="40" rx="10" fill="#2a2926" stroke="#3a3835"></rect>
          <rect x="68" y="44" width="14" height="70" rx="6" fill="#3a3835"></rect>
          <rect x="54" y="16" width="42" height="44" rx="14" fill="#4a4640" stroke="#6b6450"></rect>
          <circle cx="75" cy="27" r="4" fill="#bbb08e"></circle>
          <circle cx="35" cy="130" r="11" fill="#33312d" stroke="#6b6450"></circle>
          <path d="M28 130h14M35 123v14" stroke="#8d8776" stroke-width="1.5"></path>
          <rect x="98" y="122" width="26" height="16" rx="3" fill="#33312d" stroke="#6b6450"></rect>
        </svg>
      </div>
      <figcaption style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 600">Джойстик и колесо</span><span style="color: #a6a6a6; line-height: 1.5">Отклонение оси задаёт скорость поворота, кручение ручки - зум. Колесо перематывает общую шкалу архива. Отпускание останавливает камеру.</span></figcaption>
    </figure>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 600">Правила поста</h2>
      <sc-for list="{{rules}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; gap: 10px; padding: 10px 12px; background: #1e1e1e; border: 1px solid #2c2a27; border-radius: 8px"><span style="flex: 0 0 4px; border-radius: 2px; background: #bbb08e"></span><span style="line-height: 1.45"><b style="font-weight: 600">{{r.t}}</b> <span style="color: #a6a6a6">{{r.d}}</span></span></div>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var tones = ['#3d3a33', '#2a3036', '#55534c', '#59626a', '#1f2328', '#4a463d', '#34332f', '#2f3337', '#433f37', '#2b2a27', '#4d4d49', '#3c3a35', '#22211f', '#5a554a', '#2c2b28', '#37362f'];
    function tile(i, extra) { return 'border-radius: 2px; background: linear-gradient(180deg,' + tones[i % 16] + ' 0%, #1a1917 100%)' + (extra || ''); }
    var wall = [];
    for (var i = 0; i < 16; i++) wall.push(tile(i, i === 5 ? '; box-shadow: inset 0 0 0 2px #ffa3a1' : ''));
    var work = [tile(2, '; grid-column: 1 / span 3; grid-row: 1 / span 3; box-shadow: inset 0 0 0 2px #bbb08e'), 'grid-column: 4; grid-row: 1 / span 4; background: #1e1e1e; border-left: 1px solid #2c2a27', tile(3, '; grid-row: 4'), tile(4, '; grid-row: 4'), tile(6, '; grid-row: 4')];
    var map = ['grid-column: 1 / span 3; grid-row: 1 / span 4; background: #171614; background-image: linear-gradient(#24231f 1px, transparent 1px), linear-gradient(90deg, #24231f 1px, transparent 1px); background-size: 14px 14px', 'grid-column: 4; grid-row: 1 / span 4; background: #1a1917; border-left: 1px solid #2c2a27'];
    var keys = [['Пресет 1', 1], ['Пресет 2', 0], ['Пресет 3', 0], ['Пресет 4', 0], ['Патруль', 0], ['Принять', 2], ['Ложная', 0], ['Архив −10 с', 0], ['Закладка', 0], ['Снимок', 0], ['Говорить', 3], ['Подсветка', 0], ['Стена в архив', 0], ['Раскладка Склад', 0], ['Справка', 0]].map(function (k) {
      var bg = k[1] === 1 ? '#373428; color: #f0ece6; box-shadow: inset 0 0 0 1px #6b6044' : (k[1] === 2 ? '#504a37; color: #f0ece6' : (k[1] === 3 ? '#2c3023; color: #bfcba4' : '#26211d; color: #e8e3d9'));
      return { label: k[0], style: 'aspect-ratio: 1; display: grid; place-items: center; padding: 4px; border-radius: 8px; border-bottom: 3px solid #0c0b0a; background: ' + bg };
    });
    return {
      screens: [
        { n: '1', title: 'Стена', text: 'Раскладка 4×4 без органов управления. Тревога подсвечивает ячейку и не меняет порядок.', grid: 'grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr))', tiles: wall },
        { n: '2', title: 'Работа', text: 'Камера в фокусе, тревога или расследование. Здесь фокус клавиатуры и пульта.', grid: 'grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr))', tiles: work },
        { n: '3', title: 'План и лента', text: 'Секторы камер, путь по переходам, очередь тревог. Наведение на камеру показывает предпросмотр.', grid: 'grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr))', tiles: map }
      ],
      keys: keys,
      rules: [
        { t: 'Окна привязаны к экранам.', d: 'После перезапуска каждое окно возвращается на свой монитор.' },
        { t: 'Монитор отключили.', d: 'Окна переходят на оставшиеся экраны, управление не теряется.' },
        { t: 'Одна подписка на камеру.', d: 'Камера на стене и в работе получает один поток при совместимом профиле.' },
        { t: 'Отзыв права.', d: 'Кадр исчезает во всех окнах сразу, раскладка остаётся.' },
        { t: 'Звук только по действию.', d: 'Тревога не воспроизводит звук без настройки поста.' }
      ]
    };
  }
}
</script>
</body>
</html>
