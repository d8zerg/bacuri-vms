name: bacuri-vms-prototype

services:
  prototype:
    build:
      context: ..
      target: static-web
    ports:
      - "127.0.0.1:${BACURI_PROTOTYPE_PORT:-8088}:8080"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ../design/bacuri:/usr/share/design/bacuri:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 10
