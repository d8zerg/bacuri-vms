version: '3'

vars:
  PRESET: gcc-debug
  SUITE: trixie
  COMPOSE_RUN: 'docker compose run --rm --no-deps --user "$(id -u):$(id -g)"'
  DEV_RUN: '{{.COMPOSE_RUN}} -T dev'
  BUILD_RUN: '{{.COMPOSE_RUN}} -T builder'

tasks:
  default:
    cmd: task --list

  build:
    desc: Build the C++ targets in Docker using the selected CMake preset
    run: when_changed
    deps: [dev:image]
    requires:
      vars:
        - name: PRESET
          enum: [gcc-release, gcc-debug, gcc-coverage, clang-debug, clang-asan-ubsan, clang-tsan]
    cmd: '{{.BUILD_RUN}} sh tools/build-preset {{.PRESET | shellQuote}}'

  test:
    desc: Build and run CTest using the selected CMake preset
    deps:
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmd: >-
      {{if eq .PRESET "clang-tsan"}}{{.COMPOSE_RUN}} -T tsan{{else}}{{.BUILD_RUN}}{{end}}
      ctest --preset {{.PRESET | shellQuote}}

  lint:
    desc: Run clang-tidy on the C++ sources
    deps:
      - task: build
        vars: {PRESET: clang-debug}
    cmd: >-
      {{.COMPOSE_RUN}} -T {{if .JOBS}}-e JOBS={{.JOBS | shellQuote}}{{end}} builder
      sh tools/check-cpp lint build/clang-debug '^/workspace/(src|tests)/'

  module:test:
    desc: Build and run the Core module unit tests without the stand
    deps: [dev:image]
    cmds:
      - '{{.BUILD_RUN}} sh tools/build-preset gcc-debug --target core-module-tests'
      - '{{.BUILD_RUN}} flock build/gcc-debug/.build.lock ctest --preset gcc-debug -L core-modules --no-tests=error'

  module:unit-coverage:
    desc: Measure Core module line coverage from the unit tests alone
    deps: [dev:image, quality:image]
    cmd: bash tools/check-coverage --units

  module:check:
    desc: Check a module with Clang and enforce measured module coverage
    deps: [quality:image, dev:image, stand:up, web:build]
    requires:
      vars:
        - name: MODULE
          enum: [access, events, export, inventory, investigations, maps, media_sessions, recording, recordings, recovery]
    cmds:
      - >-
        {{.COMPOSE_RUN}} -T {{if .JOBS}}-e JOBS={{.JOBS | shellQuote}} -e BUILD_JOBS={{.JOBS | shellQuote}}{{end}} quality
        sh tools/build-preset clang-debug --target {{printf "check-%s" .MODULE | shellQuote}}
      - bash tools/check-coverage {{.MODULE | shellQuote}}

  check:
    desc: Run functional and dependency quality gates
    cmds:
      - task: check:core
      - task: deps:check

  check:core:
    desc: Check secrets, formatting, sanitizer and compiler builds, static analysis, coverage and scenarios
    cmds:
      - task: secrets:check
      - task: format:check
      - task: docs:check
      - task: access:check
      - task: camera:check
      - task: camera:commissioning
      - task: release:check
      - for: [gcc-debug, clang-debug, clang-asan-ubsan, clang-tsan]
        task: test
        vars: {PRESET: '{{.ITEM}}'}
      - task: lint
      - task: api:check
      - task: api:types
      - task: stand:check
      - task: stand:check-postgres-upgrade
      - task: schema:check
      - task: postgres:performance
      - for: [gcc-debug, clang-asan-ubsan]
        task: control:check
        vars: {PRESET: '{{.ITEM}}'}
      - for: [gcc-debug, clang-asan-ubsan]
        task: ingest:check
        vars: {PRESET: '{{.ITEM}}'}
      - for: [gcc-debug, clang-asan-ubsan]
        task: archive:check
        vars: {PRESET: '{{.ITEM}}'}

      - for: [gcc-debug, clang-asan-ubsan]
        task: playback:check
        vars: {PRESET: '{{.ITEM}}'}

      - for: [gcc-debug, clang-asan-ubsan]
        task: live:check
        vars: {PRESET: '{{.ITEM}}'}

      - for: [gcc-debug, clang-asan-ubsan, gcc-release]
        task: alerts:check
        vars: {PRESET: '{{.ITEM}}'}
      - for: [gcc-debug, clang-asan-ubsan]
        task: recovery:check
        vars: {PRESET: '{{.ITEM}}'}
      - task: investigations:check
      - task: recording-policies:check
      - task: retention:check
      - task: export:check
      - task: media:check:bookworm
      - for: [bookworm, trixie]
        task: install:check
        vars: {SUITE: '{{.ITEM}}'}
      - task: coverage:check
        vars: {WORKSPACE_CHECK: full}

  packages:build:
    desc: Export the maintained Debian packages, verified source inputs and Go utilities
    cmd: |
      set -eu
      report=$(sh tools/quality-report-dir packages)
      echo "Maintained packages: $report"
      docker build --target maintained-packages --output "type=local,dest=$report" .

  deps:refresh:
    desc: Refresh pinned vendor advisory databases and maintenance records for review
    cmd: python3 tools/lifecycle/refresh.py

  deps:check:
    desc: Check maintenance evidence and vendor advisories for the actual dependency inventory
    cmds:
      - docker compose build dev conan quality api-types ui-kit-check ui-kit-catalog playback-firefox rtsp-camera postgres offline-packager install-vm
      - docker compose pull --policy missing playback-chrome
      - python3 tools/lifecycle/scan.py

  regression:check:
    desc: Qualify a fresh source snapshot, empty volumes and all core scenarios
    cmd: python3 tools/check-regression

  quality:image:
    internal: true
    run: once
    cmd: docker compose build quality

  secrets:check:
    desc: Scan full Git history, staging area and working files with Gitleaks
    deps: [quality:image]
    cmd: |
      set -eu
      report=$(sh tools/quality-report-dir secrets)
      echo "Gitleaks reports: $report"
      {{.COMPOSE_RUN}} -T quality python3 tools/check-secrets.py "$report"

  format:check:
    desc: Check C++ sources and headers with clang-format
    deps: [quality:image]
    cmd: '{{.COMPOSE_RUN}} -T quality sh tools/check-cpp format src tests'

  coverage:check:
    desc: Require the project line coverage threshold for every product module and CMake target
    deps: [quality:image, dev:image, stand:up, web:build]
    cmds:
      - docker compose build api-types
      - bash tools/check-coverage
      - task: workspace:check
        vars: {WORKSPACE_CHECK: '{{.WORKSPACE_CHECK | default "coverage"}}'}

  check:report:
    desc: Run all checks and save the environment, log, and exit code
    cmd: bash tools/check-report

  version:
    desc: Show the product SemVer from Git
    deps: [dev:image]
    cmd: '{{.BUILD_RUN}} python3 tools/product_version.py show'

  release:next:
    desc: Suggest the next release tag from Conventional Commits
    deps: [dev:image]
    cmd: '{{.BUILD_RUN}} python3 tools/product_version.py next'

  release:check:
    desc: Build the optimized services offline and verify the core executable
    deps:
      - task: build
        vars: {PRESET: gcc-release}
    cmds:
      - '{{.BUILD_RUN}} python3 tests/release/version.py'
      - '{{.BUILD_RUN}} python3 tools/product_version.py next'
      - >-
        {{.BUILD_RUN}} sh -ec 'expected="bacuri.vms $(python3 tools/product_version.py show)";
        for exe in bacuri-vms-core bacuri-vms; do test "$(build/gcc-release/$exe --version)" = "$expected"; done;
        echo "$expected"'

  build:repro:
    desc: Compare all Release executables with a clean offline build
    deps: [release:check]
    cmd: '{{.BUILD_RUN}} sh tools/check-release-repro'

  deps:lock:
    desc: Resolve the Conan profiles and replace the dependency lockfile
    cmd: '{{.COMPOSE_RUN}} --build -T conan sh tools/conan-lock'

  stand:up:
    desc: Start PostgreSQL and the RTSP test camera and wait for health checks
    run: once
    cmd: docker compose up --build --wait --wait-timeout 60 postgres rtsp-camera

  webcam:up:
    desc: Stream the Linux V4L2 webcam over RTSP on localhost
    preconditions:
      - sh: 'test -c "${BACURI_WEBCAM_DEVICE:-/dev/video0}"'
        msg: Set BACURI_WEBCAM_DEVICE to a V4L2 video capture device
    cmd: >-
      BACURI_VIDEO_GID="$(stat -Lc %g "${BACURI_WEBCAM_DEVICE:-/dev/video0}")"
      docker compose up --build --wait --wait-timeout 45 webcam

  webcam:check:
    desc: Check both webcam profiles, a stalled preview and RTSP reconnection
    deps:
      - webcam:up
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmds:
      - '{{.DEV_RUN}} sh tests/ingest/decode.sh webcam'
      - '{{.DEV_RUN}} python3 tests/ingest/relay.py build/{{.PRESET | shellQuote}}/bacuri-vms-rtsp-test webcam'

  ingest:check:
    desc: Check the recorder media adapter against the synthetic RTSP camera
    deps:
      - stand:up
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmd: '{{.DEV_RUN}} python3 tests/ingest/relay.py build/{{.PRESET | shellQuote}}/bacuri-vms-rtsp-test rtsp-camera'

  webcam:down:
    desc: Stop webcam capture and release the V4L2 device
    cmd: docker compose stop webcam

  stand:down:
    desc: Stop the Compose stand and keep persistent volumes
    cmd: docker compose down

  stand:status:
    desc: Show the status of the Compose stand
    cmd: docker compose ps

  stand:logs:
    desc: Show recent PostgreSQL and RTSP test camera logs
    cmd: docker compose logs --tail 100 postgres rtsp-camera

  stand:check:
    desc: Check PostgreSQL, decode both RTSP streams, and verify test mounts
    deps: [dev:image, stand:up]
    cmd: '{{.DEV_RUN}} sh tests/check-stand.sh'

  stand:check-postgres-upgrade:
    desc: Verify the PostgreSQL minor upgrade on a physical copy and restore a new full backup
    cmds:
      - docker compose build postgres
      - python3 tools/check-postgres-upgrade

  stand:check-storage:
    desc: Verify persistence and the storage fault limit in a temporary Compose project
    deps: [dev:image]
    cmds:
      - docker compose build postgres
      - sh tools/check-storage

  postgres:performance:
    desc: Compare PostgreSQL index and archive query plans on a populated disposable database
    deps: [dev:image]
    cmds:
      - docker compose up -d --wait postgres
      - '{{.DEV_RUN}} python3 tests/schema/query-plans.py'

  schema:check:
    desc: Verify the manifest, database migrations and PostgreSQL module ownership on a disposable database
    deps: [dev:image, stand:up]
    cmd: '{{.DEV_RUN}} sh tests/check-schemas.sh'

  control:up:
    desc: Start the local HTTPS control, recorder and media delivery services
    deps:
      - web:build
      - task: build
        vars: {PRESET: gcc-debug}
    cmds:
      - docker compose up --wait postgres
      - docker compose run --rm --no-deps control-init
      - docker compose run --rm --no-deps core /opt/bacuri/bacuri-vms-core migrate
      - docker compose up --wait core recorder media

  control:create-user:
    desc: Create a local account with a password read from stdin
    requires: {vars: [USERNAME, ROLE]}
    cmd: docker compose exec -T core /opt/bacuri/bacuri-vms-core create-user {{.USERNAME | shellQuote}} {{.ROLE | shellQuote}}

  control:enroll-admin:
    desc: Issue a one-time WebAuthn enrollment code for a local administrator
    requires: {vars: [USERNAME]}
    cmd: docker compose exec -T core /opt/bacuri/bacuri-vms-core enroll-admin {{.USERNAME | shellQuote}}

  control:grant-point:
    desc: Grant an operator access to one observation point
    requires: {vars: [USERNAME, POINT]}
    cmd: docker compose exec -T core /opt/bacuri/bacuri-vms-core grant-point {{.USERNAME | shellQuote}} {{.POINT | shellQuote}}

  control:check:
    desc: Exercise HTTPS, PostgreSQL and recorder recovery with an isolated database
    deps:
      - dev:image
      - stand:up
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmd: '{{.DEV_RUN}} sh tests/check-control.sh {{.PRESET | shellQuote}}'

  archive:status:
    desc: Show local archive commits, catalog backlog and verification failures
    cmd: docker compose exec -T recorder /opt/bacuri/bacuri-vms-recorder archive-status

  archive:check:
    desc: Exercise fMP4 recording, crash recovery and catalog catch-up in an isolated database
    deps:
      - stand:up
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmd: '{{.DEV_RUN}} sh tests/check-control.sh {{.PRESET | shellQuote}} archive'

  export:check:
    desc: Export a synthetic alert in Chrome and verify the signed media in a disconnected container
    deps: [web:build, build]
    cmd: |
      set -eu
      report=$(sh tools/quality-report-dir export)
      echo "Export evidence: $report"
      bash tests/workspace/isolated.sh {{.PRESET | shellQuote}} "$report" export
      {{.BUILD_RUN}} python3 tests/archive/verify_export.py {{.PRESET | shellQuote}} "$report"

  investigations:check:
    desc: Verify edge recovery, multi-camera motion, archive protection and signed investigation delivery
    deps: [build, stand:up, web:build]
    cmds:
      - docker compose up -d --wait playback-chrome
      - defer: docker compose stop playback-chrome
      - '{{.DEV_RUN}} sh tests/check-control.sh {{.PRESET | shellQuote}} edge'
      - |
        set -eu
        report=$(sh tools/quality-report-dir investigations)
        {{.DEV_RUN}} env BACURI_WORKSPACE_RESULTS="/workspace/$report" sh tests/check-control.sh {{.PRESET | shellQuote}} investigations
        {{.BUILD_RUN}} python3 tests/archive/verify_export.py {{.PRESET | shellQuote}} "$report" investigations
        {{.DEV_RUN}} env BACURI_WORKSPACE_RESULTS="/workspace/$report" sh tests/check-control.sh {{.PRESET | shellQuote}} hold-capacity

  recording-policies:check:
    desc: Verify recording modes, numbered frames, audio and restart on a private camera feed
    deps: [build, stand:up, web:build]
    cmds:
      - docker compose up -d --wait playback-chrome
      - defer: docker compose stop playback-chrome
      - |
        report=$(sh tools/quality-report-dir recording-policies)
        echo "Recording policy evidence: $report"
        {{.DEV_RUN}} env BACURI_WORKSPACE_RESULTS="/workspace/$report" sh tests/check-control.sh {{.PRESET | shellQuote}} policies

  retention:check:
    desc: Verify retention expiry and recording capacity on a disposable 64 MiB volume
    deps:
      - stand:up
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmd: >-
      {{.DEV_RUN}} env BACURI_RETENTION_REPORT="$(sh tools/quality-report-dir retention)/capacity.json"
      sh tests/check-control.sh {{.PRESET | shellQuote}} retention

  recovery:check:
    desc: Measure configuration, recording and archive recovery on a disposable fault stand
    deps:
      - dev:image
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmds:
      - docker compose build postgres rtsp-camera
      - python3 tools/check-recovery {{.PRESET | shellQuote}}

  playback:check:
    desc: Verify archive search, playback permissions, first frame and seek in Chrome and Firefox
    deps:
      - web:build
      - stand:up
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmds:
      - docker compose up -d --wait playback-chrome playback-firefox
      - defer: docker compose stop playback-chrome playback-firefox
      - '{{.DEV_RUN}} sh tests/check-control.sh {{.PRESET | shellQuote}} playback'

  observation:sample:
    desc: Generate a repeatable motion observation for a point and binding revision
    requires: {vars: [POINT, REVISION]}
    cmd: docker compose run --rm --no-deps -T observation-source /opt/bacuri/bacuri-vms-observation-source sample {{.POINT | shellQuote}} {{.REVISION | shellQuote}}

  observation:submit:
    desc: Submit one Protobuf JSON observation from stdin to the local core
    cmd: docker compose run --rm --no-deps -T observation-source

  alerts:check:
    desc: Verify observation replay, alert feed recovery, access and archive navigation
    deps:
      - web:build
      - stand:up
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmds:
      - docker compose up -d --wait playback-chrome playback-firefox
      - defer: docker compose stop playback-chrome playback-firefox
      - '{{.DEV_RUN}} sh tests/check-control.sh {{.PRESET | shellQuote}} alerts'

  live:check:
    desc: Verify WebRTC preview, authorization and independent recording in Chrome and Firefox
    vars:
      CAMERA: '{{.CAMERA | default "rtsp-camera"}}'
    requires:
      vars:
        - name: CAMERA
          enum: [rtsp-camera, webcam]
    deps:
      - web:build
      - stand:up
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmds:
      - docker compose up -d --wait playback-chrome playback-firefox
      - defer: docker compose stop playback-chrome playback-firefox
      - '{{.DEV_RUN}} env BACURI_TEST_CAMERA_HOST={{.CAMERA | shellQuote}} sh tests/check-control.sh {{.PRESET | shellQuote}} live'

  monitoring:check:
    desc: Verify multi-camera workstations, HEVC recording, compatibility copies and masking
    deps: [web:build, stand:up, build]
    cmds:
      - docker compose up -d --wait playback-chrome playback-firefox
      - defer: docker compose stop playback-chrome playback-firefox
      - '{{.DEV_RUN}} sh tests/check-control.sh {{.PRESET | shellQuote}} monitoring'

  access:check:
    desc: Verify local and Keycloak sessions, site administration and access revocation in an isolated installation
    deps:
      - web:build
      - task: build
        vars: {PRESET: gcc-debug}
    cmds:
      - docker compose build postgres rtsp-camera
      - bash tests/access/isolated.sh gcc-debug

  api:check:
    desc: Validate OpenAPI, Protobuf and WebSocket schemas and examples
    deps: [dev:image]
    cmd: '{{.DEV_RUN}} sh tests/check-contracts.sh'

  api:types:
    deps: [dev:image]
    desc: Generate and type-check TypeScript definitions from OpenAPI and the error catalog
    cmds:
      - docker compose build api-types
      - >-
        {{.COMPOSE_RUN}} -T api-types sh -ec
        'mkdir -p build/contracts &&
        openapi-typescript contracts/v1/openapi.yaml --output build/contracts/api.d.ts &&
        tsc --noEmit --strict build/contracts/api.d.ts'
      - '{{.BUILD_RUN}} python3 tools/errors.py json build/contracts/errors.json'

  web:build:
    desc: Build the typed HTTPS workspace and isolated performance reference
    deps: [api:types]
    cmds:
      - docker compose build ui-kit-check
      - mkdir -p build/web-client build/workspace-fixture
      - >-
        BACURI_UI_RESULTS="$PWD/build" {{.COMPOSE_RUN}} -T ui-kit-check sh -ec
        'npm run app -- --mode fixture --outDir /results/workspace-fixture && npm run app -- --outDir /results/web-client && node --version > /results/web-build-node && npm --version > /results/web-build-npm'

  release:build:bookworm:
    desc: Build native Debian 12 binaries using Bookworm libraries
    cmds:
      - docker compose -f compose.yaml -f compose.bookworm.yaml build bookworm-builder
      - >-
        docker compose -f compose.yaml -f compose.bookworm.yaml run --rm --no-deps -T --user "$(id -u):$(id -g)"
        bookworm-builder sh tools/build-preset bookworm-release

  media:check:bookworm:
    desc: Verify native Bookworm recording, browser WebRTC playback and the alert feed
    deps: [release:build:bookworm, stand:up]
    cmds:
      - docker compose -f compose.yaml -f compose.bookworm.yaml build bookworm-media-test
      - docker compose up -d --wait playback-chrome playback-firefox
      - defer: docker compose stop playback-chrome playback-firefox
      - for: [live, alerts]
        cmd: >-
          docker compose -f compose.yaml -f compose.bookworm.yaml run --rm --no-deps -T --user "$(id -u):$(id -g)"
          bookworm-media-test sh tests/check-control.sh bookworm-release {{.ITEM}}

  release:build:trixie:
    cmds:
      - task: build
        vars: {PRESET: gcc-release}

  install:check:
    desc: Install the signed offline kit on the selected Debian release and verify reboot, WebAuthn and access rights
    vars: &kit_commands
      KIT_COMPOSE: 'docker compose {{if eq .SUITE "bookworm"}}-f compose.yaml -f compose.bookworm.yaml{{end}}'
      KIT_RUN: '{{.KIT_COMPOSE}} run --rm --no-deps --user "$(id -u):$(id -g)" -T'
    requires: {vars: [{name: SUITE, enum: [bookworm, trixie]}]}
    deps:
      - web:build
      - task: 'release:build:{{.SUITE}}'
    cmds:
      - '{{.KIT_COMPOSE}} build offline-packager install-vm'
      - |
        set -eu
        report=$(sh tools/quality-report-dir offline-install-{{.SUITE}})
        echo "Offline installation results: $report"
        {{.KIT_RUN}} offline-packager python3 tools/offline-package.py "$report" --qualification
        bash tools/check-offline-install "$report" "$({{.KIT_COMPOSE}} config --images install-vm)" {{.SUITE | shellQuote}}

  maintenance:check:
    desc: Qualify upgrade, interrupted migration, rollback and recovery with a signed predecessor
    requires: {vars: [PREVIOUS]}
    deps:
      - web:build
      - task: build
        vars: {PRESET: gcc-release}
    cmds:
      - docker compose build offline-packager install-vm rtsp-camera
      - |
        set -eu
        report=$(sh tools/quality-report-dir offline-operations)
        echo "Upgrade and recovery results: $report"
        {{.COMPOSE_RUN}} -T offline-packager python3 tools/offline-package.py "$report" --qualification
        bash tools/check-offline-operations "$report" {{.PREVIOUS | shellQuote}}

  release:package:
    desc: Assemble the offline release with the supplied GnuPG home and signing fingerprint
    vars: *kit_commands
    requires: {vars: [SIGNING_HOME, SIGNER, OUTPUT, {name: SUITE, enum: [bookworm, trixie]}]}
    deps:
      - web:build
      - task: 'release:build:{{.SUITE}}'
    cmds:
      - '{{.KIT_COMPOSE}} build offline-packager'
      - mkdir -p {{.OUTPUT | shellQuote}}
      - >-
        {{.KIT_RUN}} -v "$(realpath {{.SIGNING_HOME | shellQuote}}):/signing" -e GNUPGHOME=/signing
        -v "$(realpath {{.OUTPUT | shellQuote}}):/release" offline-packager python3 tools/offline-package.py /release --signer {{.SIGNER | shellQuote}}

  workspace:check:
    desc: Exercise offline maps, installation and monitoring on HTTPS with real media and WSS
    deps:
      - web:build
      - stand:up
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmd: bash tools/check-workspace {{.PRESET | shellQuote}} {{.WORKSPACE_CHECK | default "full" | shellQuote}}

  ui-kit:check:
    deps: [api:types]
    desc: Build the React UI Kit and Storybook, check types, keyboard, accessibility, browser coverage and fixture contract
    run: once
    cmds:
      - docker compose build ui-kit-check
      - |
        set -eu
        results="$(sh tools/quality-report-dir ui-kit)"
        BACURI_UI_RESULTS="$PWD/$results"
        export BACURI_UI_RESULTS
        echo "UI Kit results: $BACURI_UI_RESULTS"
        {{.COMPOSE_RUN}} -T ui-kit-check
        # The Storybook fixture answers as the server does: its responses follow the OpenAPI contract.
        {{.COMPOSE_RUN}} -T ui-kit-check node tests/fixture-responses.mjs /results/fixture-responses.json
        {{.BUILD_RUN}} python3 tests/contracts/fixtures.py "$results/fixture-responses.json"

  ui-kit:up:
    deps: [api:types]
    desc: Build and serve the local Storybook catalog
    cmds:
      - docker compose build ui-kit-check
      - mkdir -p build/ui-kit
      - '{{.COMPOSE_RUN}} -T -v "$PWD/build/ui-kit:/results" ui-kit-check npm run catalog'
      - docker compose up --build --force-recreate --wait --wait-timeout 30 ui-kit-catalog

  ui-kit:down:
    desc: Stop the local Storybook catalog
    cmd: docker compose stop ui-kit-catalog

  camera:check:
    desc: Validate the equipment profile and ASVS matrix and run the ONVIF equipment series on the emulator
    deps:
      - task: build
        vars: {PRESET: gcc-debug}
    cmd: '{{.BUILD_RUN}} python3 -B tests/cameras/check.py emulator "$(sh tools/quality-report-dir cameras)"'

  camera:commissioning:
    desc: Discover, register and replace synthetic ONVIF cameras with HTTPS browser playback
    deps:
      - web:build
      - stand:up
      - task: build
        vars: {PRESET: gcc-debug}
    cmds:
      - docker compose up -d --wait playback-chrome
      - defer: docker compose stop playback-chrome
      - >-
        {{.DEV_RUN}} env BACURI_WORKSPACE_RESULTS="$(sh tools/quality-report-dir commissioning)"
        sh tests/check-control.sh gcc-debug commissioning
      - >-
        {{.DEV_RUN}} env BACURI_WORKSPACE_RESULTS="$(sh tools/quality-report-dir camera-batches)"
        sh tests/check-control.sh gcc-debug batches

  camera:hardware:
    desc: Run the equipment series for the release bundle and every physical model and firmware
    requires: {vars: [STAND]}
    deps:
      - task: build
        vars: {PRESET: gcc-debug}
    cmd: >-
      {{.COMPOSE_RUN}} -T -v {{.STAND | shellQuote}}:/stand:ro dev python3 -B tests/cameras/check.py
      hardware "$(sh tools/quality-report-dir cameras)"

  docs:check:
    desc: Validate local documentation links, scenario coverage and decision references
    deps: [dev:image]
    cmd: '{{.BUILD_RUN}} python3 tests/docs/check.py'

  shell:
    desc: Open a shell in the Docker development container
    interactive: true
    deps: [dev:image]
    cmd: '{{.COMPOSE_RUN}} dev bash'

  dev:image:
    internal: true
    run: once
    cmd: docker compose build dev
