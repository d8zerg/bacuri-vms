version: '3'

vars:
  PRESET: gcc-debug
  COMPOSE_RUN: 'docker compose run --rm --no-deps --user "$(id -u):$(id -g)"'
  DEV_RUN: '{{.COMPOSE_RUN}} -T dev'

tasks:
  default:
    cmd: task --list

  build:
    desc: Build the C++ targets in Docker using the selected CMake preset
    run: when_changed
    deps: [dev:image]
    cmd: >-
      {{.DEV_RUN}} sh -ec
      'cmake --preset "$1" && cmake --build --preset "$1"'
      sh {{.PRESET | shellQuote}}

  test:
    desc: Build and run CTest using the selected CMake preset
    deps:
      - task: build
        vars: {PRESET: '{{.PRESET}}'}
    cmd: >-
      {{if eq .PRESET "clang-tsan"}}{{.COMPOSE_RUN}} -T tsan{{else}}{{.DEV_RUN}}{{end}}
      ctest --preset {{.PRESET | shellQuote}}

  lint:
    desc: Run clang-tidy on the C++ sources
    deps:
      - task: build
        vars: {PRESET: clang-debug}
    cmd: >-
      {{.DEV_RUN}} run-clang-tidy-19 -p build/clang-debug
      -clang-tidy-binary=/usr/bin/clang-tidy-19 -quiet
      -clang-apply-replacements-binary=/usr/bin/clang-apply-replacements-19
      -header-filter='^/workspace/src/'
      -checks='-*,clang-analyzer-*,bugprone-*' -warnings-as-errors='*'

  check:
    desc: Run the compiler and sanitizer matrix, static analysis, contract and stand checks
    cmds:
      - for: [gcc-debug, clang-debug, clang-asan-ubsan, clang-tsan]
        task: test
        vars: {PRESET: '{{.ITEM}}'}
      - task: lint
      - task: api:check
      - task: api:types
      - task: stand:check
      - task: schema:check

  check:report:
    desc: Run all checks and save the environment, log, and exit code
    cmd: bash tools/check-report

  stand:up:
    desc: Start PostgreSQL and the RTSP test camera and wait for health checks
    run: once
    cmd: docker compose up --build --wait --wait-timeout 60 postgres rtsp-camera

  stand:down:
    desc: Stop the Compose stand and keep persistent volumes
    cmd: docker compose down

  stand:status:
    desc: Show the status of the Compose stand
    cmd: docker compose ps

  stand:logs:
    desc: Show recent PostgreSQL and RTSP test camera logs
    cmd: docker compose logs --tail 100 postgres rtsp-camera

  stand:check:
    desc: Check PostgreSQL, decode both RTSP streams, and verify test mounts
    deps: [dev:image, stand:up]
    cmd: '{{.DEV_RUN}} sh tests/check-stand.sh'

  stand:check-storage:
    desc: Verify persistence and the storage fault limit in a temporary Compose project
    deps: [dev:image]
    cmd: sh tools/check-storage

  schema:check:
    desc: Validate the manifest and apply both initial schemas to temporary databases
    deps: [dev:image, stand:up]
    cmd: '{{.DEV_RUN}} sh tests/check-schemas.sh'

  api:check:
    desc: Validate OpenAPI, Protobuf and WebSocket schemas and examples
    deps: [dev:image]
    cmd: '{{.DEV_RUN}} sh tests/check-contracts.sh'

  api:types:
    desc: Generate and type-check TypeScript definitions from OpenAPI
    cmds:
      - docker compose build api-types
      - >-
        {{.COMPOSE_RUN}} -T api-types sh -ec
        'mkdir -p build/contracts &&
        openapi-typescript contracts/v1/openapi.yaml --output build/contracts/api.d.ts &&
        tsc --noEmit --strict build/contracts/api.d.ts'

  prototype:up:
    desc: Start the local browser prototype
    cmd: docker compose -f prototype/compose.yaml up --wait --wait-timeout 25

  prototype:down:
    desc: Stop the local browser prototype
    cmd: docker compose -f prototype/compose.yaml down

  shell:
    desc: Open a shell in the Docker development container
    interactive: true
    deps: [dev:image]
    cmd: '{{.COMPOSE_RUN}} dev bash'

  dev:image:
    internal: true
    run: once
    cmd: docker compose build dev
