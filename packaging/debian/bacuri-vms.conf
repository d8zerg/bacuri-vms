g bacuri-ipc -
g bacuri-archive -
u bacuri-core - "Bacuri control service" /var/lib/bacuri-core
u bacuri-recorder - "Bacuri recorder" /var/lib/bacuri-recorder
u bacuri-media - "Bacuri media service" /nonexistent
m bacuri-core bacuri-ipc
m bacuri-recorder bacuri-ipc
m bacuri-media bacuri-ipc
m bacuri-media bacuri-archive
m bacuri-recorder bacuri-archive
