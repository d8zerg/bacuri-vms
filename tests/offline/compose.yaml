services:
  install-vm:
    image: ${BACURI_INSTALL_VM_IMAGE:?missing VM image}
    volumes:
      - ${BACURI_INSTALL_REPORT:?missing results}:/report
    networks:
      default:
        aliases: [bacuri.test]
    command: ["python3", "tests/offline/vm.py"]
  playback-chrome:
    environment:
      SE_NODE_MAX_SESSIONS: "1"
networks:
  default:
    internal: true
