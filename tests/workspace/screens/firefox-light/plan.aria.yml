- main:
  - heading "Карты и планы" [level=1]
  - group "Подразделы карт и планов":
    - button "Карта региона"
    - button "Планы" [pressed]
  - heading "Первый этаж" [level=2]
  - radiogroup "Масштаб плана":
    - radio /\d+%/ [checked]
    - text: /\d+%/
    - radio /\d+%/
    - text: /\d+%/
  - button "Привязать план к карте"
  - img "Первый этаж"
  - 'button /Погрузочные ворота \d+ · Новых тревог: 4/ [pressed]'
  - heading /Погрузочные ворота \d+/ [level=2]
  - button "Эфир"
  - button "Архив"
  - region "События камеры":
    - heading "События камеры" [level=3]
    - list:
      - listitem:
        - button /Поток восстановлен Новая 1 янв\. \d+ г\., \d+:\d+:\d+ UTC Проверить/:
          - strong: Поток восстановлен
          - text: ""
          - time: /1 янв\. \d+ г\., \d+:\d+:\d+ UTC/
          - text: ""
      - listitem:
        - button /Смещение часов камеры Новая 1 янв\. \d+ г\., \d+:\d+:\d+ UTC Проверить/:
          - strong: Смещение часов камеры
          - text: ""
          - time: /1 янв\. \d+ г\., \d+:\d+:\d+ UTC/
          - text: ""
      - listitem:
        - button /Потеря видеопотока Новая 1 янв\. \d+ г\., \d+:\d+:\d+ UTC Проверить/:
          - strong: Потеря видеопотока
          - text: ""
          - time: /1 янв\. \d+ г\., \d+:\d+:\d+ UTC/
          - text: ""
    - button "Показать ещё (1)"
  - group: Настроить сектор обзора
  - group: Изменить положение точки
  - group: Добавить план
  - region "Управление регионами":
    - heading "Региональные карты" [level=3]
    - button "Установить регионы"
    - button "Обновить установленные" [disabled]
  - status