services:
  basic-vm:
    image: ${BACURI_BASIC_VM_IMAGE:?missing VM image}
    volumes:
      - ${BACURI_BASIC_REPORT:?missing results}:/report
    networks:
      default:
        aliases: [bacuri.test]
    command: ["python3", "tests/basic/vm.py"]
  playback-chrome:
    environment:
      SE_NODE_MAX_SESSIONS: "1"
networks:
  default:
    internal: true
