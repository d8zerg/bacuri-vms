apply_configuration:
  rpc: RecorderControl.ApplyConfiguration
  request:
    site_id: &site 10000000-0000-4000-8000-000000000001
    recording_node_id: 70000000-0000-4000-8000-000000000002
    revision: '2'
    cameras:
      - device_id: 40000000-0000-4000-8000-000000000001
        point_id: &point 20000000-0000-4000-8000-000000000001
        main_url: rtsps://camera.invalid/main
        secondary_url: rtsps://camera.invalid/sub
        channel_id: 30000000-0000-4000-8000-000000000001
        main_profile_id: b0000000-0000-4000-8000-000000000001
        binding_revision: '1'
  response:
    requested_revision: '2'
    applied_revision: '2'
    state: APPLY_STATE_APPLIED
video_profiles:
  rpc: RecorderControl.GetVideoProfiles
  request: {site_id: *site, point_id: *point}
  response: {profiles: [{main: true, codec: h265, width: 1920, height: 1080, bitrate_kbps: 4096}]}
selected_preview:
  rpc: PreviewSource.SubscribeProfile
  request: {point: {site_id: *site, point_id: *point}, main: true}
  response: {keyframe: true, codec: h265}
camera_stream_issues:
  rpc: RecorderControl.GetCameraIssues
  request:
    site_id: *site
    device_id: 40000000-0000-4000-8000-000000000001
  response:
    main: STREAM_ISSUE_TLS
    secondary: STREAM_ISSUE_UNSPECIFIED
register_block:
  rpc: ArchiveCatalog.RegisterBlock
  request:
    manifest_json: { base64_file: tests/schema/block-manifest-v1.json }
  response:
    state: REGISTRATION_STATE_REPLAYED
submit_observation:
  rpc: ObservationIngest.SubmitObservation
  request:
    site_id: *site
    source_id: 80000000-0000-4000-8000-000000000001
    observation_id: 90000000-0000-4000-8000-000000000002
    type: motion
    schema_version: 1
    source_time_us: '1500000000000640'
    clock: { epoch_id: 50000000-0000-4000-8000-000000000001, uncertainty_us: '80' }
    binding:
      point_id: *point
      revision: '1'
    attributes_json: e30=
  response:
    state: REGISTRATION_STATE_COMMITTED
authorize_delivery:
  rpc: MediaAuthorization.AuthorizeDelivery
  request:
    media_session_id: 80000000-0000-4000-8000-000000000001
    browser_session_id: 90000000-0000-4000-8000-000000000004
    point:
      site_id: *site
      point_id: *point
    archive:
      start: '2020-01-01T10:00:00Z'
      end: '2020-01-01T10:00:30Z'
  response:
    valid_for_ms: 5000
register_gap:
  rpc: ArchiveCatalog.RegisterGap
  request:
    point: { site_id: *site, point_id: *point }
    recording_node_id: 70000000-0000-4000-8000-000000000001
    binding_revision: '1'
    interval: { begin_us: '10', end_us: '20' }
    reason: source_offline
  response: { state: REGISTRATION_STATE_COMMITTED }
pending_archive:
  rpc: RecorderControl.ListPending
  request: { point: { site_id: *site, point_id: *point }, begin_us: '10', end_us: '100' }
  response: { intervals: [{ begin_us: '20', end_us: '40' }] }
preview_source:
  rpc: PreviewSource.Subscribe
  request: { site_id: *site, point_id: *point }
  response: { access_unit: AAAAAWU=, keyframe: true }
close_live:
  rpc: MediaAuthorization.CloseLive
  request:
    media_session_id: 80000000-0000-4000-8000-000000000001
    browser_session_id: internal-browser
    point: { site_id: *site, point_id: *point }
    live: {}
  response: {}
live_delivery:
  rpc: LiveDelivery.Negotiate
  request:
    scope:
      media_session_id: 80000000-0000-4000-8000-000000000001
      browser_session_id: internal-browser
      point: { site_id: *site, point_id: *point }
      live: {}
    sdp: "v=0\r\n\
      o=- 1 1 IN IP4 127.0.0.1\r\n\
      s=-\r\n\
      t=0 0\r\n\
      a=group:BUNDLE video\r\n\
      m=video 9 UDP/TLS/RTP/SAVPF 96\r\n\
      c=IN IP4 0.0.0.0\r\n\
      a=mid:video\r\n\
      a=recvonly\r\n\
      a=rtcp-mux\r\n\
      a=rtpmap:96 H264/90000\r\n\
      a=fmtp:96 packetization-mode=1;profile-level-id=42e01f\r\n\
      a=ice-ufrag:offer123\r\n\
      a=ice-pwd:offerTestPassword0000000000\r\n\
      a=fingerprint:sha-256 01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01:01\r\n\
      a=setup:actpass\r\n\
      a=candidate:1 1 UDP 2130706431 192.0.2.1 40000 typ host\r\n\
      a=end-of-candidates\r\n"
  response:
    sdp: "v=0\r\n\
      o=- 1 1 IN IP4 127.0.0.1\r\n\
      s=-\r\n\
      t=0 0\r\n\
      a=group:BUNDLE video\r\n\
      m=video 9 UDP/TLS/RTP/SAVPF 96\r\n\
      c=IN IP4 0.0.0.0\r\n\
      a=mid:video\r\n\
      a=sendonly\r\n\
      a=rtcp-mux\r\n\
      a=rtpmap:96 H264/90000\r\n\
      a=fmtp:96 packetization-mode=1;profile-level-id=42e01f\r\n\
      a=ice-ufrag:answer12\r\n\
      a=ice-pwd:answerTestPassword000000000\r\n\
      a=fingerprint:sha-256 02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02:02\r\n\
      a=setup:active\r\n\
      a=candidate:1 1 UDP 2130706431 192.0.2.2 40000 typ host\r\n\
      a=end-of-candidates\r\n"
read_archive_part:
  rpc: ArchiveDelivery.ReadPart
  request:
    scope:
      media_session_id: 80000000-0000-4000-8000-000000000001
      browser_session_id: internal-browser
      point: { site_id: *site, point_id: *point }
      archive:
        start: '2020-01-01T10:00:00Z'
        end: '2020-01-01T10:00:30Z'
    block_id: 90000000-0000-4000-8000-000000000002
    sha256: f3ef000000000000000000000000000000000000000000000000000000000001
    initialization: true
  response: { total_bytes: '4', data: ZnR5cA== }
advance_retention:
  rpc: ArchiveCatalog.AdvanceRetention
  request: { site_id: *site, recording_node_id: 70000000-0000-4000-8000-000000000001 }
  response: { cutoff_us: '2592000000000', days: 30, reserve_percent: 20 }

camera_audio:
  rpc: RecorderControl.ExchangeAudio
  request: { site_id: *site, point_id: *point, device_id: 40000000-0000-4000-8000-000000000001, mode: LISTEN }
  response: { start_us: '1000000', pcm: AAA= }
